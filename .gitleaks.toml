[extend]
useDefault = true

[[allowlists]]
description = "Committed Envio evidence contains public Ethereum addresses under creator fields"
paths = [
  '''docs/data-pipeline/envio-candidate-7f24e63-audit-20260801T042059Z\.json''',
  '''docs/data-pipeline/envio-candidate-7f24e63-baseline-20260801T042058Z\.json''',
  '''tests/data-pipeline/read-model-performance-explore-matrix\.test\.ts''',
]

[[allowlists]]
description = "Typed token-address comparisons are not API credentials"
condition = "AND"
regexTarget = "match"
paths = ['''lib/data-pipeline/optimistic-market-state\.server\.ts''']
regexes = ['''tokenAddress:\s*HexAddress''']

[[allowlists]]
description = "Launch quote orientation is not an API credential"
condition = "AND"
regexTarget = "match"
paths = ['''lib/data-pipeline/optimistic-market-state\.server\.ts''']
regexes = ['''tokenAddress\s*\|\|\s*launch\.quoteIsCurrency0''']

[[allowlists]]
description = "Candidate restriction key is the public pinned archive SHA-256"
condition = "AND"
regexTarget = "match"
paths = ['''scripts/data-pipeline/candidate-restore\.mjs''']
regexes = ['''b3679e8b178535bbc58f9c9c43690a8c7e310ade8bd93360f15004be385b02d2''']

[[allowlists]]
description = "Protocol revenue sources pin the public V4 token address and runtime code hash"
condition = "AND"
regexTarget = "match"
paths = [
  '''contracts/deployments/mainnet-protocol-revenue-v2\.json''',
  '''contracts/script/DeployMainnetProtocolRevenueV1\.s\.sol''',
  '''contracts/script/DeployMainnetProtocolRevenueV2\.s\.sol''',
  '''contracts/spec/protocol-revenue-v1\.json''',
  '''contracts/src/ProtocolRevenueExecutionEnforcerV1\.sol''',
  '''contracts/src/ProtocolRevenueMetaMaskExecutorV1\.sol''',
  '''contracts/src/ProtocolRevenueRouterV1\.sol''',
  '''contracts/src/ProtocolRevenueVaultV2\.sol''',
  '''contracts/test/ProtocolRevenueV2\.t\.sol''',
  '''contracts/test/ProtocolRevenueRouterV1MainnetFork\.t\.sol''',
  '''contracts/test/invariant/ProtocolRevenueRouterV1Invariant\.t\.sol''',
  '''contracts/test/invariant/ProtocolRevenueVaultV2Invariant\.t\.sol''',
]
regexes = [
  '''(?i)0x7987f03462200b3d8a072e02c89a8a41dcb124ee''',
  '''(?i)0x4fe466386aeebe507f6bcfc58e046a0632e4687699fa5bd28c4b7ec6333141ad''',
]

[[allowlists]]
description = "Public documentation pins the public V4 token address"
condition = "AND"
regexTarget = "match"
paths = ['''components/docs-public-policy\.ts''']
regexes = ['''(?i)V4_TOKEN_ADDRESS\s*=\s*"0x7987f03462200b3d8a072e02c89a8a41dcb124ee"''']

[[allowlists]]
description = "Live market golden sample pins the public Programmable token address"
condition = "AND"
regexTarget = "match"
paths = ['''tests/alchemy-live-market\.test\.ts''']
regexes = ['''(?i)0x7987f03462200b3d8a072e02c89a8a41dcb124ee''']

[[allowlists]]
description = "Launch stamp docs pin the public PCAN canary token address"
condition = "AND"
regexTarget = "match"
paths = [
  '''components/launch-stamp-docs-contract\.ts''',
  '''tests/launch-stamp-docs\.test\.ts''',
]
regexes = ['''(?i)0x9deeb39d2590b0cad5fc473f755c5f97dcc8f7ce''']

[[allowlists]]
description = "Bitquery market parity pins the public PCAN golden token address"
condition = "AND"
regexTarget = "match"
paths = [
  '''scripts/perf/bitquery-golden-market-parity\.mjs''',
  '''scripts/perf/bitquery-historical-release-gate\.mjs''',
  '''scripts/perf/read-model-post-promotion\.mjs''',
  '''tests/bitquery-market-data\.test\.ts''',
  '''tests/data-pipeline/bitquery-historical-release-gate\.test\.ts''',
  '''tests/data-pipeline/read-model-ops-contract\.test\.ts''',
]
regexes = ['''(?i)0x9deeb39d2590b0cad5fc473f755c5f97dcc8f7ce''']

[[allowlists]]
description = "Bitquery parity pins public Uniswap StateView and Chainlink feed addresses"
condition = "AND"
regexTarget = "match"
paths = [
  '''scripts/perf/bitquery-golden-market-parity\.mjs''',
  '''tests/data-pipeline/read-model-ops-contract\.test\.ts''',
]
regexes = [
  '''(?i)0x7ffe42c4a5deea5b0fec41c94c136cf115597227''',
  '''(?i)0x5f4ec3df9cbd43714fe2740f5e3616155c5b8419''',
]

[[allowlists]]
description = "Bitquery tests pin a public Classic token fixture address"
condition = "AND"
regexTarget = "match"
paths = ['''tests/bitquery-market-data\.test\.ts''']
regexes = ['''(?i)0x3f2a426365e7a438a7f9f758766cff419d207d51''']

[[allowlists]]
description = "Manual Router vendor artifacts contain public bytes32 runtime and pool-key hashes"
condition = "AND"
regexTarget = "match"
paths = [
  '''lib/vendor/manual-router-authority-v1/manual-router-portable\.v1\.mjs\.map''',
  '''lib/vendor/manual-router-authority-v1/artifacts/manual-router-authority-golden\.v6\.json''',
]
regexes = [
  '''tokenRuntimeCodeHash:\s*EvmBytes32V1;''',
  '''poolKeyHash:\s*EvmBytes32V1;''',
  '''tokenRuntimeCodeHash:\s*0x[0-9a-fA-F]{64}''',
  '''poolKeyHash:\s*0x[0-9a-fA-F]{64}''',
  '''poolKeyHash":\s*"0x[0-9a-fA-F]{64}"''',
]

[[allowlists]]
description = "Disabled Shards Router V2 artifacts contain only public bytes32 plan bindings"
condition = "AND"
regexTarget = "match"
paths = [
  '''lib/vendor/manual-router-authority-v2/artifacts/manual-router-v2-disabled-golden\.v1\.json''',
  '''lib/vendor/manual-router-authority-v2/manual-router-portable\.v2\.mjs''',
  '''lib/vendor/manual-router-authority-v2/manual-router-portable\.v2\.mjs\.map''',
]
regexes = [
  '''profileKey["']?\s*[:=]\s*["']?0x[0-9a-fA-F]{64}''',
  '''profileKey:\s+EvmBytes32V1;''',
  '''EXACT_SHARDS_(?:TOKEN_SALT|TOKEN|TOKEN_RUNTIME_HASH)_V1\s*=\s*"0x[0-9a-fA-F]{64}"''',
  '''(?i)0x50d17eaaeb52c66e64b918385abf6523fdae57cf''',
]

[[allowlists]]
description = "Route-closure manifests contain public onchain profile keys, not credentials"
condition = "AND"
regexTarget = "match"
paths = [
  '''config/hookemon-route-closure\.v1\.json''',
  '''contracts/spec/shards-route-closure-v1\.json''',
]
regexes = ['''profileKey"?:\s*"0x[0-9a-fA-F]{64}"''']

[[allowlists]]
description = "Exact Shards contracts and specs pin the reviewed public Router V4 profile key"
condition = "AND"
regexTarget = "match"
paths = [
  '''contracts/spec/shards-fee-policy-verifier-v1\.json''',
  '''contracts/spec/shards-registry-successor-v1\.json''',
  '''contracts/src/ProgrammableExactShardsFeePolicyVerifierV1\.sol''',
  '''contracts/src/ProgrammableExactShardsRegistryV1\.sol''',
]
regexes = ['''(?i)0xb90e215e0e29c0dacf021e5e778847af4100433ee7d22014b73f8ca4add09d0c''']

[[allowlists]]
description = "GitHub lineage specs and tests pin public deterministic repository-key vectors"
condition = "AND"
regexTarget = "match"
paths = [
  '''contracts/spec/github-repository-lineage-registry-v1\.json''',
  '''contracts/spec/shards-registry-successor-v1\.json''',
  '''contracts/test/ProgrammableGithubRepositoryLineageRegistryV1\.t\.sol''',
]
regexes = [
  '''(?i)0x84f907641e97fb220312430fcf0f98c1d513664a984d99df24aee57c226d174c''',
  '''(?i)0x02ed38e86a7c41d5dea93cf5e3f829420837c4d351d9f4675929c6ce0041e835''',
  '''(?i)0x85af67313879b9844f94b66f3eb6bdc2f200e2647507f73f43242a576580961b''',
  '''(?i)0x97316281428a106b570b0e26031c4ae18b9e959742ea4cc41c1e7cd43b921dfb''',
]

[[allowlists]]
description = "Exact Shards V2 golden vectors pin the same public deterministic repository key"
condition = "AND"
regexTarget = "match"
paths = [
  '''contracts/spec/exact-shards-public-identity-golden\.json''',
  '''contracts/spec/launch-permit-v1-golden\.json''',
  '''contracts/test/ProgrammableExactShardsPublicIdentityGolden\.t\.sol''',
  '''contracts/test/ProgrammableLaunchPermitV1Golden\.t\.sol''',
]
regexes = ['''(?i)(?:repositoryKey"?\s*[:=]\s*"?|REPOSITORY_KEY\s*=\s*)0x02ed38e86a7c41d5dea93cf5e3f829420837c4d351d9f4675929c6ce0041e835''']

[[allowlists]]
description = "Exact Shards V2 manifests and verifier pin the reviewed public Router V4 profile key"
condition = "AND"
regexTarget = "match"
paths = [
  '''contracts/spec/shards-fee-policy-verifier-v2\.json''',
  '''contracts/spec/shards-registry-successor-v2\.json''',
  '''contracts/spec/shards-successor-manifest-input-v2\.json''',
  '''contracts/src/ProgrammableExactShardsFeePolicyVerifierV2\.sol''',
]
regexes = ['''(?i)(?:profileKey"?\s*:\s*"?|PROFILE_KEY\s*=\s*)0xb90e215e0e29c0dacf021e5e778847af4100433ee7d22014b73f8ca4add09d0c''']

[[allowlists]]
description = "Exact Shards predictor fixtures contain public CREATE2 salts and bytecode hashes"
condition = "AND"
regexTarget = "match"
paths = [
  '''contracts/spec/shards-v2-predictor-golden\.json''',
  '''contracts/test/ProgrammableExactShardsRouteGatedFactoryV2\.t\.sol''',
]
regexes = [
  '''(?:tokenSalt|effectiveTokenSalt|shardToken|tokenInitCodeHash|goldenTokenSalt)"?\s*[:=]\s*"?0x[0-9a-fA-F]{64}''',
]

[[allowlists]]
description = "Launch permit authority comment names a public cancellation-key mapping"
condition = "AND"
regexTarget = "match"
paths = ['''contracts/src/ProgrammableLaunchPermitAuthorityV1\.sol''']
regexes = ['''cancellationKey\s*=>\s*ApprovalGenerationCancellationV1''']

[[allowlists]]
description = "Router V3 vendored artifacts contain public bytes32 profile and winner bindings"
condition = "AND"
regexTarget = "match"
paths = [
  '''lib/vendor/router-v2-shared-lifecycle-v3/artifacts/router-v2-shared-lifecycle-v3/completed-graph-contract-artifact-binding\.v1\.json''',
  '''lib/vendor/router-v2-shared-lifecycle-v3/artifacts/router-v2-shared-lifecycle-v3/shared-target-profile-catalog\.v3\.json''',
  '''lib/vendor/router-v2-shared-lifecycle-v3/artifacts/router-v2-shared-lifecycle-v3/completed-graph-contract-formulas\.v3\.json''',
  '''lib/vendor/router-v2-shared-lifecycle-v3/artifacts/router-v2-shared-lifecycle-v3/router-v2-shared-lifecycle-portable\.v3\.mjs''',
  '''lib/vendor/router-v2-shared-lifecycle-v3/artifacts/router-v2-shared-lifecycle-v3/router-v2-shared-lifecycle-portable\.v3\.mjs\.map''',
  '''lib/vendor/router-v2-shared-lifecycle-v3/schemas/completed-graph-adoption-contract-artifact-binding\.v1\.schema\.json''',
  '''lib/vendor/router-v2-shared-lifecycle-v3/schemas/router-v2-launch-profile-catalog\.v3\.schema\.json''',
  '''lib/vendor/router-v2-shared-lifecycle-v3/schemas/router-v2-launch-profile-descriptor\.v3\.schema\.json''',
]
regexes = [
  '''(?:profileKey|winnerKey|winnerKeyHash|winnerKeyOccupantGrantDigest|poolKeyHash|observedProfileKey|contractWinnerKeyHash)["']?\s*[:=]\s*["']?0x[0-9a-fA-F]{64}''',
  '''(?:profileKey|winnerKey|winnerKeyHash|winnerKeyOccupantGrantDigest|poolKeyHash|observedProfileKey|contractWinnerKeyHash):\s*EvmBytes32V1''',
]
