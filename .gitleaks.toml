[extend]
useDefault = true

[[allowlists]]
description = "Committed Envio evidence contains public Ethereum addresses under creator fields"
paths = [
  '''docs/data-pipeline/envio-candidate-7f24e63-audit-20260801T042059Z\.json''',
  '''docs/data-pipeline/envio-candidate-7f24e63-baseline-20260801T042058Z\.json''',
  '''tests/data-pipeline/read-model-performance-explore-matrix\.test\.ts''',
]

[[allowlists]]
description = "Typed token-address comparisons are not API credentials"
condition = "AND"
regexTarget = "match"
paths = ['''lib/data-pipeline/optimistic-market-state\.server\.ts''']
regexes = ['''tokenAddress:\s*HexAddress''']

[[allowlists]]
description = "Launch quote orientation is not an API credential"
condition = "AND"
regexTarget = "match"
paths = ['''lib/data-pipeline/optimistic-market-state\.server\.ts''']
regexes = ['''tokenAddress\s*\|\|\s*launch\.quoteIsCurrency0''']

[[allowlists]]
description = "Candidate restriction key is the public pinned archive SHA-256"
condition = "AND"
regexTarget = "match"
paths = ['''scripts/data-pipeline/candidate-restore\.mjs''']
regexes = ['''b3679e8b178535bbc58f9c9c43690a8c7e310ade8bd93360f15004be385b02d2''']

[[allowlists]]
description = "Protocol revenue sources pin the public V4 token address and runtime code hash"
condition = "AND"
regexTarget = "match"
paths = [
  '''contracts/deployments/mainnet-protocol-revenue-v2\.json''',
  '''contracts/script/DeployMainnetProtocolRevenueV1\.s\.sol''',
  '''contracts/script/DeployMainnetProtocolRevenueV2\.s\.sol''',
  '''contracts/spec/protocol-revenue-v1\.json''',
  '''contracts/src/ProtocolRevenueExecutionEnforcerV1\.sol''',
  '''contracts/src/ProtocolRevenueMetaMaskExecutorV1\.sol''',
  '''contracts/src/ProtocolRevenueRouterV1\.sol''',
  '''contracts/src/ProtocolRevenueVaultV2\.sol''',
  '''contracts/test/ProtocolRevenueV2\.t\.sol''',
  '''contracts/test/ProtocolRevenueRouterV1MainnetFork\.t\.sol''',
  '''contracts/test/invariant/ProtocolRevenueRouterV1Invariant\.t\.sol''',
  '''contracts/test/invariant/ProtocolRevenueVaultV2Invariant\.t\.sol''',
]
regexes = [
  '''(?i)0x7987f03462200b3d8a072e02c89a8a41dcb124ee''',
  '''(?i)0x4fe466386aeebe507f6bcfc58e046a0632e4687699fa5bd28c4b7ec6333141ad''',
]

[[allowlists]]
description = "Launch stamp docs pin the public PCAN canary token address"
condition = "AND"
regexTarget = "match"
paths = [
  '''components/launch-stamp-docs-contract\.ts''',
  '''tests/launch-stamp-docs\.test\.ts''',
]
regexes = ['''(?i)0x9deeb39d2590b0cad5fc473f755c5f97dcc8f7ce''']
