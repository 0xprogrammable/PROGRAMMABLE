{
  "name": "Programmable primary Foundry evidence",
  "on": [
    "push"
  ],
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "programmable-primary-evidence": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 1,
            "persist-credentials": false
          }
        },
        {
          "uses": "foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09"
        },
        {
          "run": "forge fmt --check"
        },
        {
          "run": "forge build"
        },
        {
          "run": "forge test"
        }
      ]
    }
  }
}
