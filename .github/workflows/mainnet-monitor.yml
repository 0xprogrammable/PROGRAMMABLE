name: Mainnet Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mainnet-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Verify Mainnet invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Restore canonical monitor cursor
        id: restore-cursor
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .monitor-state
          key: mainnet-monitor-${{ github.run_id }}
          restore-keys: |
            mainnet-monitor-

      - name: Run read-only invariant monitor
        id: monitor
        continue-on-error: true
        env:
          MAINNET_RPC_URLS: ${{ secrets.MAINNET_RPC_URL_A }},${{ secrets.MAINNET_RPC_URL_B }}
          MEME_MONITOR_STATE_FILE: .monitor-state/mainnet-classic-v2.json
        run: |
          set -o pipefail
          npm run contracts:mainnet:monitor:once 2>&1 | tee mainnet-monitor.log

      - name: Run Stock-Paired V3 runtime and starting-FDV monitor
        id: stock-monitor
        continue-on-error: true
        env:
          MAINNET_RPC_URLS: ${{ secrets.MAINNET_RPC_URL_A }},${{ secrets.MAINNET_RPC_URL_B }}
          STOCK_PAIRED_MONITOR_OUTPUT_FILE: stock-paired-v3-monitor.json
        run: |
          set -o pipefail
          npm run contracts:stock-paired-v3:monitor 2>&1 | tee stock-paired-v3-monitor.log

      - name: Save canonical monitor cursor
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .monitor-state
          key: mainnet-monitor-${{ github.run_id }}

      - name: Preserve monitor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mainnet-monitor-${{ github.run_id }}
          path: |
            mainnet-monitor.log
            .monitor-state/mainnet-classic-v2.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve Stock-Paired monitor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stock-paired-v3-monitor-${{ github.run_id }}
          path: |
            stock-paired-v3-monitor.log
            stock-paired-v3-monitor.json
          if-no-files-found: warn
          retention-days: 30

      - name: Open or update incident issue
        if: steps.monitor.outcome == 'failure' || steps.stock-monitor.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CLASSIC_MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          STOCK_MONITOR_OUTCOME: ${{ steps.stock-monitor.outcome }}
        with:
          script: |
            const title = "Mainnet monitor requires attention";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            const body = [
              "The read-only Mainnet invariant monitor failed.",
              "",
              `Classic outcome: ${process.env.CLASSIC_MONITOR_OUTCOME}`,
              `Stock-Paired V3 outcome: ${process.env.STOCK_MONITOR_OUTCOME}`,
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "New launch construction must remain disabled until the failure is reconciled through both configured RPCs.",
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                assignees: [context.repo.owner],
              });
            }

      - name: Close recovered incident issue
        if: steps.monitor.outcome == 'success' && steps.stock-monitor.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = "Mainnet monitor requires attention";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recovered in ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }

      - name: Fail workflow after evidence and alerting
        if: steps.monitor.outcome == 'failure' || steps.stock-monitor.outcome == 'failure'
        run: exit 1
