name: Ethereum Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  pull_request:
    paths:
      - "src/**"
      - "test/ClassicV3MainnetFork.t.sol"
      - "test/ShardV1MainnetFork.t.sol"
      - "deployments/**"
      - "models/**"
      - "releases/**"
      - "scripts/verify-mainnet-bytecode.sh"
      - ".github/workflows/mainnet-evidence.yml"

permissions:
  contents: read

concurrency:
  group: ethereum-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mainnet-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable

      - name: Bootstrap pinned dependencies
        run: ./scripts/bootstrap-deps.sh

      - name: Verify Ethereum runtime bytecode
        env:
          ETHEREUM_RPC_URL: https://ethereum-rpc.publicnode.com
        run: ./scripts/verify-mainnet-bytecode.sh

      - name: Run Classic lifecycle fork test
        run: |
          for rpc_url in https://rpc.flashbots.net https://eth.drpc.org; do
            for attempt in 1 2; do
              echo "Fork attempt ${attempt} with ${rpc_url}"
              if ETHEREUM_RPC_URL="${rpc_url}" forge test --match-contract ClassicV3MainnetForkTest; then
                exit 0
              fi
            done
          done
          exit 1

      - name: Run Shards lifecycle fork test
        run: |
          for rpc_url in https://rpc.flashbots.net https://eth.drpc.org; do
            for attempt in 1 2; do
              echo "Fork attempt ${attempt} with ${rpc_url}"
              if ETHEREUM_RPC_URL="${rpc_url}" forge test --match-contract ShardV1MainnetForkTest; then
                exit 0
              fi
            done
          done
          exit 1
