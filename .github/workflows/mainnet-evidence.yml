name: Ethereum Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  pull_request:
    paths:
      - "src/**"
      - "deployment/router-v4/**"
      - "artifacts/router-v4-deployment-v1/**"
      - "test/ClassicV3MainnetFork.t.sol"
      - "test/ProgrammableLaunchStampRouterV2*.t.sol"
      - "deployments/**"
      - "models/**"
      - "releases/**"
      - "scripts/verify-mainnet-bytecode.sh"
      - "scripts/generate-router-v4-deployment-artifact.mjs"
      - "scripts/verify-router-v4-deployment-v1.sh"
      - ".github/workflows/mainnet-evidence.yml"

permissions:
  contents: read

concurrency:
  group: ethereum-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mainnet-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Bootstrap pinned dependencies
        run: ./scripts/bootstrap-deps.sh

      - name: Verify Ethereum runtime bytecode
        env:
          ETHEREUM_RPC_URL: https://ethereum-rpc.publicnode.com
        run: ./scripts/verify-mainnet-bytecode.sh

      - name: Run Classic lifecycle fork test
        shell: bash
        run: |
          set -euo pipefail
          for rpc_url in \
            https://rpc.flashbots.net \
            https://eth.drpc.org \
            https://mainnet.gateway.tenderly.co; do
            for attempt in 1 2 3; do
              echo "Fork attempt ${attempt} with ${rpc_url}"
              if ETHEREUM_RPC_URL="${rpc_url}" forge test --match-contract ClassicV3MainnetForkTest; then
                exit 0
              fi
              sleep $((attempt * 3))
            done
          done
          exit 1

      - name: Run exact Router V2 Mainnet fork tests
        shell: bash
        run: |
          set -euo pipefail
          for rpc_url in \
            https://rpc.flashbots.net \
            https://eth.drpc.org \
            https://mainnet.gateway.tenderly.co; do
            for attempt in 1 2 3; do
              echo "Router V2 fork attempt ${attempt} with ${rpc_url}"
              if ETHEREUM_RPC_URL="${rpc_url}" FOUNDRY_FUZZ_RUNS=1000 forge test \
                --match-path 'test/ProgrammableLaunchStampRouterV2*.t.sol' \
                --fuzz-seed 0x7368617264732d726f757465722d7632; then
                exit 0
              fi
              sleep $((attempt * 3))
            done
          done
          exit 1

      - name: Run exact Router V4 dual-profile Mainnet fork tests
        shell: bash
        run: |
          set -euo pipefail
          for rpc_url in \
            https://rpc.flashbots.net \
            https://eth.drpc.org \
            https://mainnet.gateway.tenderly.co; do
            for attempt in 1 2 3; do
              echo "Router V4 fork attempt ${attempt} with ${rpc_url}"
              if (
                cd deployment/router-v4
                ETHEREUM_RPC_URL="${rpc_url}" forge test \
                  --match-path test/ProgrammableExactShardsNestedFactoryFork.t.sol
                ETHEREUM_RPC_URL="${rpc_url}" forge test \
                  --match-path test/ProgrammableRouterDeploymentMainnetFork.t.sol
              ); then
                exit 0
              fi
              sleep $((attempt * 3))
            done
          done
          exit 1
