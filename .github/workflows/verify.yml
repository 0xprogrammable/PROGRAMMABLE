name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      verification_mode:
        description: Verify the complete current Custom V2 tree for an exact Generic production release
        required: true
        type: choice
        options:
          - custom-v2-release

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      contracts: ${{ steps.scope.outputs.contracts }}
      custom_v2: ${{ steps.scope.outputs.custom_v2 }}
      database: ${{ steps.scope.outputs.database }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      indexer: ${{ steps.scope.outputs.indexer }}
      interface: ${{ steps.scope.outputs.interface }}
      read_model: ${{ steps.scope.outputs.read_model }}
      robinhood_phase_b_evidence: ${{ steps.scope.outputs.robinhood_phase_b_evidence }}
      robinhood_phase_b_evidence_exact: ${{ steps.scope.outputs.robinhood_phase_b_evidence_exact }}

    steps:
      - name: Check out complete change history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode || 'change' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$VERIFICATION_MODE" = custom-v2-release ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/production
            node scripts/ci/classify-verify-paths.mjs --custom-v2-release > "$RUNNER_TEMP/verify-scope.txt"
          elif [ "$VERIFICATION_MODE" != change ]; then
            echo "Verification mode is invalid" >&2
            exit 1
          elif [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            node scripts/ci/classify-verify-paths.mjs --all > "$RUNNER_TEMP/verify-scope.txt"
          else
            git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"

            if git cat-file -e "$BASE_SHA:scripts/ci/classify-verify-paths.mjs"; then
              git show "$BASE_SHA:scripts/ci/classify-verify-paths.mjs" > "$RUNNER_TEMP/classify-verify-paths.mjs"
              node "$RUNNER_TEMP/classify-verify-paths.mjs" "$RUNNER_TEMP/changed-paths.txt" > "$RUNNER_TEMP/verify-scope.txt"
            else
              # The bootstrap change has no trusted-base classifier yet, so it
              # deliberately pays the complete gate once.
              node scripts/ci/classify-verify-paths.mjs --all > "$RUNNER_TEMP/verify-scope.txt"
            fi
          fi

          # The first production commit that adds the Custom V2 lane is still
          # classified by its trusted base. Pay the new lane once without
          # changing or narrowing any trusted-base legacy result.
          if ! grep -Eq '^custom_v2=(true|false)$' "$RUNNER_TEMP/verify-scope.txt"; then
            echo 'custom_v2=true' >> "$RUNNER_TEMP/verify-scope.txt"
          fi
          if ! grep -Eq '^robinhood_phase_b_evidence=(true|false)$' "$RUNNER_TEMP/verify-scope.txt"; then
            echo 'robinhood_phase_b_evidence=false' >> "$RUNNER_TEMP/verify-scope.txt"
            echo 'robinhood_phase_b_evidence_exact=false' >> "$RUNNER_TEMP/verify-scope.txt"
          fi
          cat "$RUNNER_TEMP/verify-scope.txt" >> "$GITHUB_OUTPUT"

  secret-scan:
    name: Credential leak gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out complete change history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Scan exact change history
        env:
          PROGRAMMABLE_GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/security/run-gitleaks-ci.sh

  indexer:
    name: Realtime indexer
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require successful change classification
        if: needs.scope.result != 'success'
        run: exit 1

      - name: Check out repository
        if: needs.scope.outputs.indexer == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        if: needs.scope.outputs.indexer == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0

      - name: Pin pnpm
        if: needs.scope.outputs.indexer == 'true'
        working-directory: indexer
        run: |
          npm install --global pnpm@10.32.0
          test "$(pnpm --version)" = "10.32.0"

      - name: Install indexer dependencies
        if: needs.scope.outputs.indexer == 'true'
        working-directory: indexer
        run: pnpm install --frozen-lockfile

      - name: Audit indexer production dependencies
        if: needs.scope.outputs.indexer == 'true'
        working-directory: indexer
        run: |
          node --test ../scripts/ci/run-indexer-dependency-audit.test.mjs
          node ../scripts/ci/run-indexer-dependency-audit.mjs

      - name: Generate and verify indexer
        if: needs.scope.outputs.indexer == 'true'
        working-directory: indexer
        run: |
          pnpm codegen
          pnpm typecheck
          pnpm test

      - name: Skip unaffected indexer
        if: needs.scope.result == 'success' && needs.scope.outputs.indexer != 'true'
        run: echo "No indexer paths changed."

  database-pglite:
    name: Database (PGlite)
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require successful change classification
        if: needs.scope.result != 'success'
        run: exit 1

      - name: Check out repository
        if: needs.scope.outputs.database == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        if: needs.scope.outputs.database == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        if: needs.scope.outputs.database == 'true'
        run: npm ci

      - name: Run fresh-database SQL tests
        if: needs.scope.outputs.database == 'true'
        run: npm run db:test:pglite

      - name: Verify database-backed website runtime
        if: needs.scope.outputs.database == 'true'
        run: npm run test:database-runtime:ci

      - name: Skip unaffected database
        if: needs.scope.result == 'success' && needs.scope.outputs.database != 'true'
        run: echo "No database paths changed."

  interface:
    name: Interface
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require successful change classification
        if: needs.scope.result != 'success'
        run: exit 1

      - name: Check out repository
        if: needs.scope.outputs.interface == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        if: needs.scope.outputs.interface == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        if: needs.scope.outputs.interface == 'true'
        run: npm ci

      - name: Install pinned Chromium for wallet interaction tests
        if: needs.scope.outputs.interface == 'true'
        run: npx playwright install --with-deps chromium

      - name: Audit production dependencies
        if: needs.scope.outputs.interface == 'true' && needs.scope.outputs.dependencies == 'true'
        run: |
          node --test scripts/ci/run-production-dependency-audit.test.mjs
          npm run audit:prod

      - name: Verify affected interface
        if: needs.scope.outputs.interface == 'true'
        env:
          PROGRAMMABLE_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PROGRAMMABLE_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run verify:interface:ci

      - name: Verify V4 clean-room no-broadcast release gate
        if: needs.scope.outputs.interface == 'true'
        run: npm run release:custom-launch:v4:clean-room:test

      - name: Verify affected read-model operations contract
        if: needs.scope.outputs.read_model == 'true'
        run: npm run perf:read-model:ops-gate

      - name: Skip unaffected interface
        if: needs.scope.result == 'success' && needs.scope.outputs.interface != 'true'
        run: echo "No interface paths changed."

  contracts:
    name: Contracts
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require successful change classification
        if: needs.scope.result != 'success'
        run: exit 1

      - name: Check out repository
        if: >-
          needs.scope.outputs.contracts == 'true' ||
          needs.scope.outputs.robinhood_phase_b_evidence == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        if: >-
          needs.scope.outputs.contracts == 'true' ||
          needs.scope.outputs.robinhood_phase_b_evidence == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Set up Python
        if: needs.scope.outputs.contracts == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Foundry
        if: needs.scope.outputs.contracts == 'true'
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1

      - name: Install dependencies
        if: needs.scope.outputs.contracts == 'true'
        run: |
          npm ci
          pipx install slither-analyzer==0.11.5

      - name: Reject partial or mixed Robinhood Phase B backend evidence imports
        if: >-
          needs.scope.outputs.robinhood_phase_b_evidence == 'true' &&
          needs.scope.outputs.robinhood_phase_b_evidence_exact != 'true'
        run: exit 1

      - name: Install locked dependencies for exact Robinhood Phase B backend evidence
        if: needs.scope.outputs.robinhood_phase_b_evidence_exact == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install exact Cosign verifier for Robinhood Phase B backend evidence
        if: needs.scope.outputs.robinhood_phase_b_evidence_exact == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          cosign_dir="$(mktemp -d "$RUNNER_TEMP/cosign-v3.1.3.XXXXXX")"
          chmod 0700 "$cosign_dir"
          cosign="$cosign_dir/cosign-linux-amd64"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64" \
            --output "$cosign"
          printf '%s  %s\n' \
            '4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71' \
            "$cosign" | sha256sum --check --strict
          chmod 0700 "$cosign"
          echo "PROGRAMMABLE_COSIGN_BIN=$cosign" >> "$GITHUB_ENV"

      - name: Verify exact fresh Robinhood Phase B backend evidence
        if: needs.scope.outputs.robinhood_phase_b_evidence_exact == 'true'
        run: |
          set -euo pipefail
          for evidence_path in \
            release/robinhood-chain-4663/backend-promotion-input.attestation.json \
            release/robinhood-chain-4663/backend-promotion-input.public.json
          do
            test "$(git ls-files --stage -- "$evidence_path" | awk '{print $1}')" = "100644"
            test -f "$evidence_path"
            test ! -L "$evidence_path"
            test "$(stat -c '%a' "$evidence_path")" = "644"
          done
          node contracts/scripts/finalize-robinhood-custom-launch-deployment.mjs \
            verify-backend-import \
            --stage release/robinhood-chain-4663/programmable-stage-bundle.json \
            --backend-input release/robinhood-chain-4663/backend-promotion-input.public.json \
            --backend-attestation-bundle \
              release/robinhood-chain-4663/backend-promotion-input.attestation.json \
            --repository-root "$GITHUB_WORKSPACE"

      - name: Verify contracts
        if: needs.scope.outputs.contracts == 'true'
        run: npm run contracts:verify:ci

      - name: Check official Uniswap deployments
        if: needs.scope.outputs.contracts == 'true'
        run: npm run contracts:official-deployments

      - name: Run Slither
        if: needs.scope.outputs.contracts == 'true'
        run: npm run contracts:slither

      - name: Verify contract release bindings
        if: needs.scope.outputs.contracts == 'true'
        run: npm run test:contract-release:ci

      - name: Skip unaffected contracts
        if: >-
          needs.scope.result == 'success' &&
          needs.scope.outputs.contracts != 'true' &&
          needs.scope.outputs.robinhood_phase_b_evidence != 'true'
        run: echo "No contract paths changed."

  custom-v2:
    name: Custom V2
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require successful change classification
        if: needs.scope.result != 'success'
        run: exit 1

      - name: Check out repository
        if: needs.scope.outputs.custom_v2 == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        if: needs.scope.outputs.custom_v2 == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        if: needs.scope.outputs.custom_v2 == 'true'
        run: npm ci

      - name: Verify exact Website projection database operator
        if: needs.scope.outputs.custom_v2 == 'true'
        run: >-
          node --test
          scripts/website-projection-db-operator.test.mjs
          scripts/website-projection-db-credential-rotation.test.mjs

      - name: Verify exact Generic V2 read-model contract derivation
        if: needs.scope.outputs.custom_v2 == 'true'
        run: node --test scripts/test/custom-v2-read-model-contract-v2.test.mjs

      - name: Verify exact Custom V2 surface
        if: needs.scope.outputs.custom_v2 == 'true'
        run: npm run verify:custom-v2:ci

      - name: Skip unaffected Custom V2
        if: needs.scope.result == 'success' && needs.scope.outputs.custom_v2 != 'true'
        run: echo "No Custom V2 paths changed."

  production-proof:
    name: Bind production Verify proof
    if: >-
      github.ref == 'refs/heads/production' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.verification_mode == 'custom-v2-release'))
    needs:
      - scope
      - secret-scan
      - indexer
      - database-pglite
      - interface
      - contracts
      - custom-v2
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact verified production commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0

      - name: Create exact production Verify proof
        env:
          PRODUCTION_VERIFY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode || 'change' }}
          PRODUCTION_VERIFY_SCOPE_CONTRACTS: ${{ needs.scope.outputs.contracts }}
          PRODUCTION_VERIFY_SCOPE_CUSTOM_V2: ${{ needs.scope.outputs.custom_v2 }}
          PRODUCTION_VERIFY_SCOPE_DATABASE: ${{ needs.scope.outputs.database }}
          PRODUCTION_VERIFY_SCOPE_DEPENDENCIES: ${{ needs.scope.outputs.dependencies }}
          PRODUCTION_VERIFY_SCOPE_INDEXER: ${{ needs.scope.outputs.indexer }}
          PRODUCTION_VERIFY_SCOPE_INTERFACE: ${{ needs.scope.outputs.interface }}
          PRODUCTION_VERIFY_SCOPE_READ_MODEL: ${{ needs.scope.outputs.read_model }}
          PRODUCTION_VERIFY_SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          PRODUCTION_VERIFY_INDEXER_RESULT: ${{ needs.scope.outputs.indexer == 'true' && needs.indexer.result || 'skipped' }}
          PRODUCTION_VERIFY_DATABASE_PGLITE_RESULT: ${{ needs.scope.outputs.database == 'true' && needs.database-pglite.result || 'skipped' }}
          PRODUCTION_VERIFY_INTERFACE_RESULT: ${{ needs.scope.outputs.interface == 'true' && needs.interface.result || 'skipped' }}
          PRODUCTION_VERIFY_CONTRACTS_RESULT: ${{ needs.scope.outputs.contracts == 'true' && needs.contracts.result || 'skipped' }}
          PRODUCTION_VERIFY_CUSTOM_V2_RESULT: ${{ needs.scope.outputs.custom_v2 == 'true' && needs.custom-v2.result || 'skipped' }}
        run: >-
          node scripts/production-verify-proof.mjs create
          --repository-root "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/production-verify-proof.json"

      - name: Attest exact production Verify proof
        id: attest-proof
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/production-verify-proof.json

      - name: Preserve immutable production Verify proof
        id: upload-proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-verify-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-verify-proof.json
          if-no-files-found: error
          retention-days: 7

      - name: Record exact production Verify proof
        env:
          ATTESTATION_URL: ${{ steps.attest-proof.outputs.attestation-url }}
          ARTIFACT_DIGEST: ${{ steps.upload-proof.outputs.artifact-digest }}
          PRODUCTION_VERIFY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode || 'change' }}
        run: |
          {
            echo "## Production Verify proof"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Event/mode: \`$GITHUB_EVENT_NAME\` / \`$PRODUCTION_VERIFY_MODE\`"
            echo "- Artifact SHA-256: \`$ARTIFACT_DIGEST\`"
            echo "- Sigstore attestation: $ATTESTATION_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  aggregate:
    # Keep one stable, always-run PR context while the lane jobs remain
    # independently addressable and path-routed. The production proof above
    # remains separate and binds either exact path-scoped push verification or
    # an explicit current-tree Custom V2 release verification.
    name: Verify aggregate
    needs:
      - scope
      - secret-scan
      - indexer
      - database-pglite
      - interface
      - contracts
      - custom-v2
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every protected verification lane to complete
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          INDEXER_RESULT: ${{ needs.indexer.result }}
          DATABASE_RESULT: ${{ needs.database-pglite.result }}
          INTERFACE_RESULT: ${{ needs.interface.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          CUSTOM_V2_RESULT: ${{ needs.custom-v2.result }}
        run: |
          set -euo pipefail
          for result in "$SCOPE_RESULT" "$SECRET_SCAN_RESULT" "$INDEXER_RESULT" "$DATABASE_RESULT" "$INTERFACE_RESULT" "$CONTRACTS_RESULT" "$CUSTOM_V2_RESULT"; do
            test "$result" = success || {
              echo "Verification lane did not succeed: $result" >&2
              exit 1
            }
          done
