name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable

      - name: Bootstrap pinned dependencies
        run: ./scripts/bootstrap-deps.sh

      - name: Verify model registry
        run: node scripts/verify-model-registry.mjs

      - name: Verify release evidence
        run: node scripts/verify-release-evidence.mjs

      - name: Check documentation links
        run: node scripts/check-documentation-links.mjs

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        env:
          FOUNDRY_PROFILE: ci
        run: forge test

      - name: Check gas snapshot
        run: forge snapshot --fuzz-seed 0x70726f6772616d6d61626c65 --check .gas-snapshot
