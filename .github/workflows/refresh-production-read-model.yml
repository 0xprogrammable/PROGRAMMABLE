name: Explore index reset status (manual)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-explore-index-reset-status
  cancel-in-progress: true

jobs:
  reset-status:
    name: Confirm the production Explore index remains reset
    if: >-
      github.repository_id == 1314365508 &&
      github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Record retired refresh authority
        run: |
          {
            echo "## Explore index reset"
            echo
            echo "- Status: \`index-reset\`"
            echo "- Refresh workers: \`retired\`"
            echo "- External indexing calls: \`0\`"
            echo
            echo "This workflow is intentionally a no-op while the replacement indexer is designed."
          } >> "$GITHUB_STEP_SUMMARY"
