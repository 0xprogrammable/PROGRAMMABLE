name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: stable

      - name: Bootstrap pinned dependencies
        run: ./scripts/bootstrap-deps.sh

      - name: Install Slither
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check slither-analyzer==0.11.5

      - name: Run Slither
        run: .venv/bin/slither . --config-file slither.config.json

      - name: Measure source coverage
        run: forge coverage --exclude-tests --report lcov --report-file lcov.info

      - name: Check coverage floors
        run: node scripts/check-coverage.mjs lcov.info

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Check workflows
        run: "$(go env GOPATH)/bin/actionlint"
