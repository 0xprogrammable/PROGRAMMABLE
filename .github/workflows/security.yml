name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Bootstrap pinned dependencies
        run: ./scripts/bootstrap-deps.sh

      - name: Install Slither
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check slither-analyzer==0.11.5

      - name: Run Slither
        run: .venv/bin/slither . --config-file slither.config.json --sarif slither.sarif --fail-none

      - name: Publish Slither results
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: slither.sarif

      - name: Verify hash-bound via-IR coverage inputs
        run: node scripts/check-coverage.mjs /dev/null scripts/coverage-via-ir-exceptions.json --inputs-only

      - name: Test via-IR-only Router V2 paths on independent RPCs
        shell: bash
        run: |
          set -euo pipefail
          # PublicNode denies archive reads from GitHub-hosted runner IPs without a token.
          # These two unauthenticated archive-capable providers are independent of one another.
          for rpc in https://eth.drpc.org https://mainnet.gateway.tenderly.co; do
            passed=0
            for attempt in 1 2; do
              if ETHEREUM_RPC_URL="$rpc" FOUNDRY_FUZZ_RUNS=1000 forge test \
                --match-path 'test/ProgrammableLaunchStampRouterV2*.t.sol' \
                --fuzz-seed 0x7368617264732d726f757465722d7632; then
                passed=1
                break
              fi
              sleep $((attempt * 3))
            done
            test "$passed" -eq 1
          done

      - name: Measure source coverage
        run: >-
          forge coverage
          --ir-minimum
          --no-match-contract ClassicV3MainnetForkTest
          --exclude-tests
          --report lcov
          --report-file lcov.info

      - name: Check coverage floors
        run: node scripts/check-coverage.mjs lcov.info scripts/coverage-via-ir-exceptions.json

      - name: Install actionlint
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Check workflows
        run: '"$RUNNER_TEMP/bin/actionlint"'
