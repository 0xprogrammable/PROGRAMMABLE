name: Stage Production Candidate

on:
  workflow_dispatch:
    inputs:
      custom_launch_public_enablement:
        description: Require the detached Custom Launch release record and stage an enabled candidate
        required: true
        default: false
        type: boolean
      custom_launch_dark_release:
        description: Require the detached Custom Launch release record and stage a disabled dark candidate
        required: true
        default: false
        type: boolean
      custom_launch_release_record_commit_sha:
        description: Exact commit on command-center-release-records containing the detached record
        required: false
        default: ""
        type: string
      custom_launch_release_record_sha256:
        description: Canonical detached record SHA-256 printed by the verifier
        required: false
        default: ""
        type: string
      manual_applicant_launch_enablement:
        description: Stage the separately gated Applicant-owned Router launch lane
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: programmable-production
  cancel-in-progress: false

jobs:
  release-gate:
    name: Consume exact full production Verify proof
    if: >-
      github.repository == '0xprogrammable/programmable' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/production'
    permissions:
      actions: read
      attestations: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verified_sha: ${{ steps.verify-proof.outputs.verified_sha }}
      verified_tree: ${{ steps.verify-proof.outputs.verified_tree }}
      verify_run_id: ${{ steps.verify-proof.outputs.verify_run_id }}
      verify_run_attempt: ${{ steps.verify-proof.outputs.verify_run_attempt }}
      artifact_id: ${{ steps.resolve-proof.outputs.artifact_id }}
      proof_sha256: ${{ steps.verify-proof.outputs.proof_sha256 }}
      artifact_digest: ${{ steps.verify-proof.outputs.artifact_digest }}
      verified_contracts: ${{ steps.verify-proof.outputs.verified_contracts }}
      verified_database: ${{ steps.verify-proof.outputs.verified_database }}
      verified_dependencies: ${{ steps.verify-proof.outputs.verified_dependencies }}
      verified_indexer: ${{ steps.verify-proof.outputs.verified_indexer }}
      verified_interface: ${{ steps.verify-proof.outputs.verified_interface }}
      verified_read_model: ${{ steps.verify-proof.outputs.verified_read_model }}

    steps:
      - name: Check out exact production commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0

      - name: Resolve latest exact full production Verify proof
        id: resolve-proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/production-verify-proof.mjs resolve
          --repository-root "$GITHUB_WORKSPACE"
          --github-output "$GITHUB_OUTPUT"

      - name: Download exact immutable production Verify proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve-proof.outputs.artifact_id }}
          path: ${{ runner.temp }}/production-verify-proof
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve-proof.outputs.verify_run_id }}
          digest-mismatch: error

      - name: Verify Sigstore provenance and exact proof contents
        id: verify-proof
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIGEST: ${{ steps.resolve-proof.outputs.artifact_digest }}
          VERIFY_RUN_ID: ${{ steps.resolve-proof.outputs.verify_run_id }}
          VERIFY_RUN_ATTEMPT: ${{ steps.resolve-proof.outputs.verify_run_attempt }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/production-verify-proof/production-verify-proof.json"
          attestation_result="$RUNNER_TEMP/production-verify-attestation.json"
          test -f "$proof"
          gh attestation verify "$proof" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/verify.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json > "$attestation_result"
          ATTESTATION_RESULT="$attestation_result" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync(process.env.ATTESTATION_RESULT, "utf8"));
            if (!Array.isArray(result) || result.length < 1) {
              throw new Error("No valid production Verify attestation was returned");
            }
          '
          node scripts/production-verify-proof.mjs verify \
            --repository-root "$GITHUB_WORKSPACE" \
            --proof "$proof" \
            --run-id "$VERIFY_RUN_ID" \
            --run-attempt "$VERIFY_RUN_ATTEMPT" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --github-output "$GITHUB_OUTPUT"

      - name: Record consumed production Verify proof
        env:
          VERIFY_RUN_URL: ${{ steps.resolve-proof.outputs.verify_run_url }}
          PROOF_COMPLETED_AT: ${{ steps.resolve-proof.outputs.proof_completed_at }}
          PROOF_SHA256: ${{ steps.verify-proof.outputs.proof_sha256 }}
          ARTIFACT_DIGEST: ${{ steps.verify-proof.outputs.artifact_digest }}
        run: |
          {
            echo "## Consumed production Verify proof"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Verify run: $VERIFY_RUN_URL"
            echo "- Proof completed: \`$PROOF_COMPLETED_AT\`"
            echo "- Proof SHA-256: \`$PROOF_SHA256\`"
            echo "- Immutable artifact digest: \`$ARTIFACT_DIGEST\`"
            echo "- Read-model lane required: \`${{ steps.verify-proof.outputs.verified_read_model }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Stage programmable.market candidate
    needs: release-gate
    if: >-
      github.repository == '0xprogrammable/programmable' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/production' &&
      needs.release-gate.outputs.verified_sha == github.sha
    permissions:
      actions: read
      attestations: read
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out production
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release-gate.outputs.verified_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Revalidate exact Verify proof after production approval
        id: revalidate-proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/production-verify-proof.mjs resolve
          --repository-root "$GITHUB_WORKSPACE"
          --github-output "$GITHUB_OUTPUT"

      - name: Confirm consumed Verify proof identity after production approval
        env:
          EXPECTED_SHA: ${{ needs.release-gate.outputs.verified_sha }}
          EXPECTED_TREE: ${{ needs.release-gate.outputs.verified_tree }}
          EXPECTED_RUN_ID: ${{ needs.release-gate.outputs.verify_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.release-gate.outputs.verify_run_attempt }}
          EXPECTED_ARTIFACT_ID: ${{ needs.release-gate.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.release-gate.outputs.artifact_digest }}
          REVALIDATED_SHA: ${{ steps.revalidate-proof.outputs.verified_sha }}
          REVALIDATED_TREE: ${{ steps.revalidate-proof.outputs.verified_tree }}
          REVALIDATED_RUN_ID: ${{ steps.revalidate-proof.outputs.verify_run_id }}
          REVALIDATED_RUN_ATTEMPT: ${{ steps.revalidate-proof.outputs.verify_run_attempt }}
          REVALIDATED_ARTIFACT_ID: ${{ steps.revalidate-proof.outputs.artifact_id }}
          REVALIDATED_ARTIFACT_DIGEST: ${{ steps.revalidate-proof.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$REVALIDATED_SHA" = "$EXPECTED_SHA"
          test "$REVALIDATED_TREE" = "$EXPECTED_TREE"
          test "$REVALIDATED_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$REVALIDATED_RUN_ATTEMPT" = "$EXPECTED_RUN_ATTEMPT"
          test "$REVALIDATED_ARTIFACT_ID" = "$EXPECTED_ARTIFACT_ID"
          test "$REVALIDATED_ARTIFACT_DIGEST" = "$EXPECTED_ARTIFACT_DIGEST"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@54.1.0

      - name: Pull production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Resolve Custom Launch release-record policy
        id: custom-launch-policy
        env:
          CUSTOM_LAUNCH_PUBLIC_ENABLEMENT_REQUESTED: ${{ inputs.custom_launch_public_enablement }}
          CUSTOM_LAUNCH_DARK_RELEASE_REQUESTED: ${{ inputs.custom_launch_dark_release }}
          CUSTOM_LAUNCH_PRODUCTION_MODE: ${{ vars.CUSTOM_LAUNCH_PRODUCTION_MODE }}
        run: >-
          node scripts/resolve-custom-launch-staging-policy.mjs
          --env-file .vercel/.env.production.local
          --requested "$CUSTOM_LAUNCH_PUBLIC_ENABLEMENT_REQUESTED"
          --dark-release-requested "$CUSTOM_LAUNCH_DARK_RELEASE_REQUESTED"
          --production-mode "$CUSTOM_LAUNCH_PRODUCTION_MODE"
          --github-output "$GITHUB_OUTPUT"

      - name: Capture sensitive production environment metadata
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          umask 077
          vercel env ls production --format json --token="$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-production-env-metadata.json"
          node scripts/bind-vercel-sensitive-production-metadata.mjs \
            --metadata-file "$RUNNER_TEMP/vercel-production-env-metadata.json" \
            --vercel-project-id "$VERCEL_PROJECT_ID"

      - name: Resolve manual Applicant launch policy
        id: manual-applicant-policy
        env:
          MANUAL_APPLICANT_LAUNCH_ENABLEMENT_REQUESTED: ${{ inputs.manual_applicant_launch_enablement }}
          MANUAL_APPLICANT_LAUNCH_PROTECTED_MODE: ${{ vars.PROGRAMMABLE_MANUAL_APPLICANT_LAUNCH_MODE }}
          PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT }}
          PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT }}
        run: >-
          node scripts/resolve-manual-applicant-launch-policy.mjs
          --env-file .vercel/.env.production.local
          --manual-sensitive-metadata "$RUNNER_TEMP/vercel-production-env-metadata.json"
          --vercel-project-id "$VERCEL_PROJECT_ID"
          --alchemy-endpoint-commitment "$PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT"
          --quicknode-endpoint-commitment "$PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT"
          --requested "$MANUAL_APPLICANT_LAUNCH_ENABLEMENT_REQUESTED"
          --protected-mode "$MANUAL_APPLICANT_LAUNCH_PROTECTED_MODE"
          --github-output "$GITHUB_OUTPUT"

      - name: Capture current production rollback target
        id: production-before
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npm run perf:read-model:production-binding --
          --target-url "https://programmable.market"
          --reject-git-head "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify detached Custom Launch release record
        id: custom-launch-record
        if: steps.custom-launch-policy.outputs.release_record_required == 'true'
        env:
          RECORD_COMMIT_SHA: ${{ inputs.custom_launch_release_record_commit_sha }}
          RECORD_VERIFICATION_LEVEL: ${{ steps.custom-launch-policy.outputs.release_record_verification_level }}
          EXPECTED_RECORD_SHA256: ${{ inputs.custom_launch_release_record_sha256 }}
          EXPECTED_PACKAGE_ARTIFACT_HASH: ${{ secrets.PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH }}
          EXPECTED_CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA: ${{ vars.PROGRAMMABLE_BACKEND_CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA }}
          EXPECTED_CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256: ${{ vars.PROGRAMMABLE_BACKEND_CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256 }}
          PROGRAMMABLE_BACKEND_RELEASE_READ_TOKEN: ${{ secrets.PROGRAMMABLE_BACKEND_RELEASE_READ_TOKEN }}
          COMMAND_CENTER_GITHUB_TOKEN: ${{ github.token }}
          ROLLBACK_DEPLOYMENT_ID: ${{ steps.production-before.outputs.deployment_id }}
          ROLLBACK_DEPLOYMENT_URL: ${{ steps.production-before.outputs.deployment_url }}
          ROLLBACK_WEBSITE_COMMIT_SHA: ${{ steps.production-before.outputs.git_head }}
        run: |
          set -euo pipefail
          if [[ ! "$RECORD_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Custom Launch requires one exact detached-record commit" >&2
            exit 1
          fi
          if [[ "$RECORD_COMMIT_SHA" == "$GITHUB_SHA" ]]; then
            echo "The detached record must not be stored in its Website subject commit" >&2
            exit 1
          fi
          case "$RECORD_VERIFICATION_LEVEL" in
            staging|dark-staging) ;;
            *)
              echo "Custom Launch release-record verification level is invalid" >&2
              exit 1
              ;;
          esac
          record_ref="refs/remotes/origin/command-center-release-records"
          record_path="release-records/custom-launch-v1/release-record.json"
          record_file="$RUNNER_TEMP/custom-launch-release-record.json"
          test ! -e "$record_file"
          umask 077
          git fetch --no-tags origin \
            "+refs/heads/command-center-release-records:$record_ref"
          git cat-file -e "$RECORD_COMMIT_SHA^{commit}"
          git merge-base --is-ancestor "$RECORD_COMMIT_SHA" "$record_ref"
          test "$(git show -s --format=%ae "$RECORD_COMMIT_SHA")" = \
            "309941960+0xprogrammable@users.noreply.github.com"
          record_commit_json="$RUNNER_TEMP/custom-launch-release-record-commit.json"
          test ! -e "$record_commit_json"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $COMMAND_CENTER_GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$record_commit_json" \
            "https://api.github.com/repos/0xprogrammable/programmable/commits/$RECORD_COMMIT_SHA"
          RECORD_COMMIT_JSON="$record_commit_json" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const commit = JSON.parse(readFileSync(process.env.RECORD_COMMIT_JSON, "utf8"));
          if (
            commit.sha !== process.env.RECORD_COMMIT_SHA ||
            commit.author?.login !== "0xprogrammable" ||
            commit.committer?.login !== "0xprogrammable" ||
            commit.commit?.verification?.verified !== true
          ) {
            throw new Error("detached record commit lacks verified Programmable provenance");
          }
          NODE
          git show "$RECORD_COMMIT_SHA:$record_path" > "$record_file"
          attestation_summary_file="$RUNNER_TEMP/custom-launch-cross-repository-attestation.json"
          test ! -e "$attestation_summary_file"
          node scripts/verify-custom-launch-release-record.mjs "$record_file" \
            --require "$RECORD_VERIFICATION_LEVEL" \
            --verify-cross-repository-attestation \
            --cross-repository-attestation-summary "$attestation_summary_file" \
            --expect-website-commit "$GITHUB_SHA" \
            --expect-package-artifact-hash "$EXPECTED_PACKAGE_ARTIFACT_HASH" \
            --expect-cross-repository-attestation-commit "$EXPECTED_CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA" \
            --expect-cross-repository-binding-document-sha256 "$EXPECTED_CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256" \
            --expect-rollback-deployment-id "$ROLLBACK_DEPLOYMENT_ID" \
            --expect-rollback-deployment-url "$ROLLBACK_DEPLOYMENT_URL" \
            --expect-rollback-website-commit "$ROLLBACK_WEBSITE_COMMIT_SHA" \
            --expect-detached-record-sha256 "$EXPECTED_RECORD_SHA256" \
            --github-output "$GITHUB_OUTPUT"

      - name: Preserve detached Custom Launch release record
        if: steps.custom-launch-policy.outputs.release_record_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-launch-release-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/custom-launch-release-record.json
            ${{ runner.temp }}/custom-launch-cross-repository-attestation.json
          if-no-files-found: error
          retention-days: 90

      - name: Record Custom Launch release gate
        if: steps.custom-launch-policy.outputs.release_record_required == 'true'
        env:
          RECORD_COMMIT_SHA: ${{ inputs.custom_launch_release_record_commit_sha }}
        run: |
          {
            echo "## Custom Launch release record"
            echo
            echo "- Record commit: \`$RECORD_COMMIT_SHA\`"
            echo "- Release subject: \`${{ steps.custom-launch-record.outputs.release_subject_sha256 }}\`"
            echo "- Detached record: \`${{ steps.custom-launch-record.outputs.detached_record_sha256 }}\`"
            echo "- Backend cross-repository attestation: \`${{ steps.custom-launch-record.outputs.cross_repository_attestation_commit_sha }}\`"
            echo "- Backend binding document: \`${{ steps.custom-launch-record.outputs.cross_repository_binding_document_sha256 }}\`"
            echo "- Review authority: \`${{ steps.custom-launch-record.outputs.review_authority_mode }}\`"
            echo "- Gate: \`${{ steps.custom-launch-policy.outputs.release_record_verification_level }}\` only"
            echo "- Stage mode: \`${{ steps.custom-launch-policy.outputs.staging_mode }}\`"
            echo
            echo "No promotion is authorized by this staging gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve read-model release policy
        id: read-model-policy
        env:
          PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT }}
          PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT }}
        run: >-
          npm run perf:read-model:deploy-policy --
          --env-file .vercel/.env.production.local
          --sensitive-env-metadata "$RUNNER_TEMP/vercel-production-env-metadata.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Build production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Stage production build without assigning domains
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT }}
          PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain --archive=tgz --meta githubCommitSha="$GITHUB_SHA" --env VERCEL_GIT_COMMIT_SHA="$GITHUB_SHA" --env PROGRAMMABLE_RELEASE_COMMIT_SHA="$GITHUB_SHA" --env PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT="$PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT" --env PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT="$PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT" --token="$VERCEL_TOKEN")"
          case "$deployment_url" in
            https://*) ;;
            *)
              echo "Vercel did not return a deployment URL" >&2
              exit 1
              ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Resolve exact staged deployment
        id: staged-deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: >-
          npm run perf:read-model:staged-deployment --
          --target-url "$DEPLOYMENT_URL"
          --github-output "$GITHUB_OUTPUT"

      - name: Gate exact staged Custom Launch candidate
        id: custom-launch-canary
        if: steps.custom-launch-policy.outputs.staging_mode == 'enabled'
        env:
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PROGRAMMABLE_RELEASE_EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH: ${{ secrets.PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_REVIEW_AUTHORITY_MODE: ${{ steps.custom-launch-record.outputs.review_authority_mode }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_ACCESS_TOKEN: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_ACCESS_TOKEN }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_IDENTITY_TOKEN: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_IDENTITY_TOKEN }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_EXPECTED_GITHUB_USER_ID: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_EXPECTED_GITHUB_USER_ID }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_OWN_APPLICATION_HANDLE: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_OWN_APPLICATION_HANDLE }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_FOREIGN_APPLICATION_HANDLE: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_FOREIGN_APPLICATION_HANDLE }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          deployment_host="$(node --input-type=module -e '
            const url = new URL(process.env.STAGED_TARGET_URL);
            if (
              url.protocol !== "https:" ||
              url.pathname !== "/" ||
              url.search !== "" ||
              url.hash !== "" ||
              !url.hostname.endsWith(".vercel.app")
            ) throw new Error("Custom Launch canary target is not an immutable Vercel origin");
            process.stdout.write(url.host);
          ')"
          export PROGRAMMABLE_RELEASE_EXPECTED_DEPLOYMENT_HOST="$deployment_host"
          npm run probe:custom-launch -- \
            "--base-url=$STAGED_TARGET_URL" \
            "--deployment-id=$STAGED_DEPLOYMENT_ID" \
            "--evidence-output=$RUNNER_TEMP/custom-launch-candidate-canary-evidence.json" \
            --require-enabled \
            --authenticated-canary
          echo "evidence_path=$RUNNER_TEMP/custom-launch-candidate-canary-evidence.json" >> "$GITHUB_OUTPUT"

      - name: Preserve redacted Custom Launch candidate evidence
        if: steps.custom-launch-policy.outputs.staging_mode == 'enabled'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-launch-candidate-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.custom-launch-canary.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Gate exact staged dark Custom Launch candidate
        id: custom-launch-dark-release
        if: steps.custom-launch-policy.outputs.staging_mode == 'dark'
        env:
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PROGRAMMABLE_RELEASE_EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH: ${{ secrets.PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_REVIEW_AUTHORITY_MODE: ${{ steps.custom-launch-record.outputs.review_authority_mode }}
          RELEASE_SUBJECT_SHA256: ${{ steps.custom-launch-record.outputs.release_subject_sha256 }}
          DETACHED_RECORD_SHA256: ${{ steps.custom-launch-record.outputs.detached_record_sha256 }}
          CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA: ${{ steps.custom-launch-record.outputs.cross_repository_attestation_commit_sha }}
          CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256: ${{ steps.custom-launch-record.outputs.cross_repository_binding_document_sha256 }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          deployment_host="$(node --input-type=module -e '
            const url = new URL(process.env.STAGED_TARGET_URL);
            if (
              url.protocol !== "https:" ||
              url.username !== "" ||
              url.password !== "" ||
              url.pathname !== "/" ||
              url.search !== "" ||
              url.hash !== "" ||
              !url.hostname.endsWith(".vercel.app")
            ) throw new Error("Custom Launch dark target is not an immutable Vercel origin");
            process.stdout.write(url.host);
          ')"
          export PROGRAMMABLE_RELEASE_EXPECTED_DEPLOYMENT_HOST="$deployment_host"
          evidence_path="$RUNNER_TEMP/custom-launch-dark-release-evidence.json"
          npm run probe:custom-launch -- \
            "--base-url=$STAGED_TARGET_URL" \
            "--deployment-id=$STAGED_DEPLOYMENT_ID" \
            "--dark-release-evidence-output=$evidence_path" \
            "--release-subject-sha256=$RELEASE_SUBJECT_SHA256" \
            "--detached-record-sha256=$DETACHED_RECORD_SHA256" \
            "--cross-repository-attestation-commit-sha=$CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA" \
            "--cross-repository-binding-document-sha256=$CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256" \
            --require-disabled
          echo "evidence_path=$evidence_path" >> "$GITHUB_OUTPUT"

      - name: Preserve redacted Custom Launch dark release evidence
        if: steps.custom-launch-policy.outputs.staging_mode == 'dark'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-launch-dark-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.custom-launch-dark-release.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Gate exact staged QuickNode wake route
        if: needs.release-gate.outputs.verified_read_model == 'true' && steps.read-model-policy.outputs.wake_canary_required == 'true'
        env:
          PROGRAMMABLE_QUICKNODE_STREAM_SECRET: ${{ secrets.PROGRAMMABLE_QUICKNODE_STREAM_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
        run: >-
          npm run perf:read-model:wake-canary --
          --target-url "$STAGED_TARGET_URL"

      - name: Attest exact staged release policy
        id: release-attestation
        env:
          PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT }}
          PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT }}
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          POLICY_MODE: ${{ steps.read-model-policy.outputs.mode }}
        run: >-
          npm run perf:read-model:deploy-policy --
          --env-file .vercel/.env.production.local
          --sensitive-env-metadata "$RUNNER_TEMP/vercel-production-env-metadata.json"
          --verified-sha "$GITHUB_SHA"
          --vercel-project-id "$VERCEL_PROJECT_ID"
          --staged-deployment-id "$STAGED_DEPLOYMENT_ID"
          --staged-target-url "$STAGED_TARGET_URL"
          --production-origin "https://programmable.market"
          --expected-mode "$POLICY_MODE"
          --attestation-output "$RUNNER_TEMP/staged-release-attestation.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Preserve staged release attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-release-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.release-attestation.outputs.attestation_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Record staged release attestation
        run: |
          {
            echo "## Staged release attestation"
            echo
            echo "- SHA-256: \`${{ steps.release-attestation.outputs.attestation_sha256 }}\`"
            echo "- Runtime mode: \`${{ steps.read-model-policy.outputs.mode }}\`"
            echo "- Production target: https://programmable.market"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify staged deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --max-time 30 "$DEPLOYMENT_URL/" > /dev/null

      - name: Verify staged manual Applicant runtime
        if: steps.manual-applicant-policy.outputs.enabled == 'true'
        env:
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: >-
          node scripts/verify-manual-applicant-staged-runtime.mjs
          --target-url "$STAGED_TARGET_URL"

      - name: Smoke staged Bitquery market APIs
        if: needs.release-gate.outputs.verified_read_model == 'true'
        env:
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          const { verifyBitqueryGoldenMarketParityV1 } = await import(
            "./scripts/perf/bitquery-golden-market-parity.mjs"
          );
          const {
            boundedStaleMarketTimeV1,
            verifyBitqueryHistoricalGoldenReleaseV1,
          } = await import(
            "./scripts/perf/bitquery-historical-release-gate.mjs"
          );
          const goldenTokenAddress =
            "0x9deeb39d2590b0cad5fc473f755c5f97dcc8f7ce";
          const goldenPoolId =
            "0x5c5a3ebee6840640642ba2bea526621a4962d2c89c388c36a2edb4725802a229";
          const goldenQuoteAddress =
            "0x0000000000000000000000000000000000000000";
          const origin = new URL(process.env.STAGED_TARGET_URL);
          if (
            origin.protocol !== "https:" ||
            !origin.hostname.endsWith(".vercel.app") ||
            origin.pathname !== "/" ||
            origin.search ||
            origin.hash
          ) {
            throw new Error("Bitquery smoke target is not an exact Vercel origin");
          }
          const automationBypassSecret =
            process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
          const automationBypassSecretLength = Buffer.byteLength(
            automationBypassSecret ?? "",
            "utf8",
          );
          if (
            typeof automationBypassSecret !== "string" ||
            automationBypassSecretLength < 32 ||
            automationBypassSecretLength > 512 ||
            /[\r\n]/.test(automationBypassSecret)
          ) {
            throw new Error("Bitquery smoke automation bypass is unavailable");
          }
          const bitquerySmokeRequestHeaders = Object.freeze({
            Accept: "application/json",
            "x-vercel-protection-bypass": automationBypassSecret,
          });
          const bitqueryMarketContract = Object.freeze({
            readSources: Object.freeze(["operational+durable+postgres"]),
            rpcProviders: null,
            marketSources: Object.freeze(["bitquery"]),
            dataQualities: Object.freeze(["complete", "partial", "stale"]),
          });
          const bitqueryChartContract = Object.freeze({
            readSources: null,
            rpcProviders: null,
            marketSources: Object.freeze(["bitquery"]),
            dataQualities: Object.freeze([
              "ready",
              "insufficient-history",
              "partial",
            ]),
          });
          const unavailableValuationReasons = new Set([
            "no-market",
            "supply-unavailable",
            "liquidity-unavailable",
            "price-unavailable",
            "inconsistent-snapshot",
            "waiting-for-first-trade",
            "source-unavailable",
          ]);

          const headerMatches = (value, expected) =>
            expected === null
              ? value === null
              : expected.includes(value ?? "");
          const positiveInteger = (value) =>
            typeof value === "string" && /^[1-9][0-9]*$/.test(value);
          const positiveDecimalToWad = (value) => {
            const match = /^(0|[1-9][0-9]*)(?:\.([0-9]+))?$/.exec(
              String(value ?? ""),
            );
            if (!match) return null;
            const wad = BigInt(match[1]) * 10n ** 18n +
              BigInt((match[2] ?? "").slice(0, 18).padEnd(18, "0") || "0");
            return wad > 0n ? wad : null;
          };
          const validMarketTime = (value) => {
            const parsed = Date.parse(value ?? "");
            return Number.isFinite(parsed) &&
              parsed <= Date.now() + 60_000;
          };
          const currentMarketTime = (value) =>
            validMarketTime(value) &&
            Date.now() - Date.parse(value) <= 6 * 60_000;
          const boundedStaleMarketTime = boundedStaleMarketTimeV1;

          const requestJson = async (path, contract) => {
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(new URL(path, origin), {
                  redirect: "error",
                  headers: bitquerySmokeRequestHeaders,
                  signal: AbortSignal.timeout(30_000),
                });
                const text = await response.text();
                if (!response.ok) {
                  throw new Error(`${path} returned ${response.status}`);
                }
                if (Buffer.byteLength(text, "utf8") > 2 * 1024 * 1024) {
                  throw new Error(`${path} returned an oversized response`);
                }
                const readSource = response.headers.get(
                  "x-programmable-read-source",
                );
                const rpcProvider = response.headers.get(
                  "x-programmable-rpc-provider",
                );
                const marketSource = response.headers.get(
                  "x-programmable-market-source",
                );
                const priceSource = response.headers.get(
                  "x-programmable-price-source",
                );
                const marketAsOf = response.headers.get(
                  "x-programmable-market-as-of",
                );
                const dataQuality = response.headers.get(
                  "x-programmable-data-quality",
                );
                if (
                  !headerMatches(readSource, contract.readSources) ||
                  !headerMatches(rpcProvider, contract.rpcProviders) ||
                  !headerMatches(marketSource, contract.marketSources) ||
                  !headerMatches(dataQuality, contract.dataQualities) ||
                  (contract.priceSources !== undefined &&
                    !headerMatches(priceSource, contract.priceSources))
                ) {
                  throw new Error(
                    `${path} did not prove its required identity and market sources`,
                  );
                }
                const body = JSON.parse(text);
                const expectedDataQuality = body?.dataQuality?.status ?? body?.status;
                if (dataQuality !== expectedDataQuality) {
                  throw new Error(`${path} has inconsistent data-quality provenance`);
                }
                Object.defineProperty(body, "__marketHeaders", {
                  value: Object.freeze({
                    dataQuality,
                    marketAsOf,
                    marketSource,
                    priceSource,
                  }),
                  enumerable: false,
                });
                return body;
              } catch (error) {
                lastError = error;
                if (attempt < 12) {
                  await new Promise((resolve) => setTimeout(resolve, 5_000));
                }
              }
            }
            throw lastError ?? new Error(`${path} failed`);
          };

          const explore = await requestJson(
            "/api/explore?limit=20&page=1&sort=market-cap",
            bitqueryMarketContract,
          );
          if (
            explore.status !== "ready" ||
            !Array.isArray(explore.tokens) ||
            explore.tokens.length < 1 ||
            explore.tokens.length > 20
          ) {
            throw new Error("staged Bitquery Explore is not a populated bounded page");
          }
          const releaseToken = explore.tokens.find(
            (token) =>
              /^0x[0-9a-fA-F]{40}$/.test(token?.tokenAddress ?? ""),
          );
          if (!releaseToken) {
            throw new Error("staged Bitquery Explore has no token identity");
          }
          let previousCurrentFdv = null;
          let currentFdvCount = 0;
          let availableFdvCount = 0;
          let staleFdvCount = 0;
          let waitingForFirstTradeCount = 0;
          let sawNonCurrentFdv = false;
          let currentFdvToken = null;
          for (const token of explore.tokens) {
            const valuation = token?.valuation;
            if (valuation?.status === "unavailable") {
              if (!unavailableValuationReasons.has(valuation.reason)) {
                throw new Error("staged Bitquery Explore has an untyped unavailable valuation");
              }
              if (valuation.reason === "waiting-for-first-trade") {
                waitingForFirstTradeCount += 1;
              }
              sawNonCurrentFdv = true;
              if (token?.fdvUsdWad !== undefined) {
                throw new Error(
                  "staged Bitquery Explore exposed stale or unavailable FDV as current",
                );
              }
              continue;
            }
            if (
              valuation?.status !== "available" ||
              valuation.metric !== "fdv" ||
              valuation.supplyBasis !== "total" ||
              valuation.currency !== "usd" ||
              !["current", "stale"].includes(valuation.freshness) ||
              valuation.source !== "bitquery" ||
              !positiveInteger(valuation.valueWad) ||
              !validMarketTime(valuation.asOfTime)
            ) {
              throw new Error("staged Bitquery Explore has an invalid typed FDV");
            }
            availableFdvCount += 1;
            if (valuation.freshness === "stale") {
              if (!boundedStaleMarketTime(valuation.asOfTime)) {
                throw new Error("staged Bitquery Explore stale FDV is too old");
              }
              staleFdvCount += 1;
              sawNonCurrentFdv = true;
              if (token?.fdvUsdWad !== undefined) {
                throw new Error(
                  "staged Bitquery Explore exposed stale or unavailable FDV as current",
                );
              }
              continue;
            }
            if (token.fdvUsdWad !== valuation.valueWad) {
              throw new Error("staged Bitquery Explore did not expose its current FDV");
            }
            if (!currentMarketTime(valuation.asOfTime)) {
              throw new Error("staged Bitquery Explore mislabeled stale FDV as current");
            }
            if (sawNonCurrentFdv) {
              throw new Error(
                "staged Bitquery Highest FDV placed current data after stale data",
              );
            }
            const value = BigInt(valuation.valueWad);
            if (previousCurrentFdv !== null && value > previousCurrentFdv) {
              throw new Error(
                "staged Bitquery Highest FDV is not monotonically descending",
              );
            }
            const tokenAddress = token?.tokenAddress?.toLowerCase();
            const primary = token.marketData?.pools?.find(
              (pool) => pool.identity?.poolId === token.marketData?.primaryPoolId,
            );
            if (
              !/^0x[0-9a-f]{40}$/.test(tokenAddress ?? "") ||
              tokenAddress === goldenTokenAddress ||
              token.marketData?.schemaVersion !==
                "programmable.market-data.v1" ||
              token.marketData.source !== "bitquery" ||
              !currentMarketTime(token.marketData.generatedAt) ||
              !/^0x[0-9a-f]{64}$/.test(
                token.marketData.primaryPoolId ?? "",
              ) ||
              !primary ||
              primary.identity?.chainId !== "1" ||
              primary.identity?.tokenAddress !== tokenAddress ||
              primary.identity?.poolId !== token.marketData.primaryPoolId ||
              primary.identity?.protocol !== "uniswap_v4" ||
              primary.source !== "bitquery" ||
              primary.status !== "current" ||
              primary.liquidity?.freshness !== "current" ||
              !positiveInteger(primary.liquidity?.valueUsdWad) ||
              !positiveInteger(primary.liquidity?.asOfBlock) ||
              primary.liquidity?.asOfTime !== valuation.asOfTime ||
              !currentMarketTime(primary.liquidity?.asOfTime) ||
              primary.valuation?.status !== "available" ||
              primary.valuation.metric !== "fdv" ||
              primary.valuation.supplyBasis !== "total" ||
              primary.valuation.freshness !== "current" ||
              primary.valuation.valueUsdWad !== valuation.valueWad ||
              primary.valuation.asOfTime !== valuation.asOfTime
            ) {
              throw new Error(
                "staged Bitquery current public FDV lacks exact primary-pool liquidity evidence",
              );
            }
            previousCurrentFdv = value;
            currentFdvCount += 1;
            currentFdvToken ??= token;
          }
          const exploreMarketAsOf =
            explore.dataQuality?.valuation?.asOfTime ?? null;
          const valuationQuality = explore.dataQuality?.valuation;
          if (
            explore.dataQuality?.schemaVersion !==
              "programmable.explore-data-quality.v1" ||
            explore.__marketHeaders?.dataQuality !== explore.dataQuality.status ||
            !["complete", "partial", "stale"].includes(
              explore.dataQuality.status,
            ) ||
            valuationQuality?.metric !== "fdv" ||
            !Number.isSafeInteger(valuationQuality.available) ||
            !Number.isSafeInteger(valuationQuality.unavailable) ||
            valuationQuality.available + valuationQuality.unavailable !==
              explore.total ||
            !Number.isSafeInteger(valuationQuality.stale) ||
            valuationQuality.stale > valuationQuality.available ||
            valuationQuality.unknown !== 0 ||
            ![null, "bitquery"].includes(
              explore.__marketHeaders?.priceSource ?? null,
            ) ||
            (currentFdvCount > 0 &&
              explore.__marketHeaders?.priceSource !== "bitquery") ||
            explore.__marketHeaders?.marketAsOf !== exploreMarketAsOf ||
            (exploreMarketAsOf !== null &&
              !boundedStaleMarketTime(exploreMarketAsOf))
          ) {
            throw new Error(
              "staged Bitquery Explore has inconsistent market provenance",
            );
          }
          if (currentFdvCount < 1) {
            throw new Error(
              "staged Bitquery market path has no current public non-PCAN FDV with exact primary-pool liquidity evidence",
            );
          }
          const newestPageSize = 100;
          const newest = await requestJson(
            `/api/explore?limit=${newestPageSize}&page=1&sort=newest`,
            bitqueryMarketContract,
          );
          const newestTotal = Number(newest.total);
          const newestTotalPages = Number(newest.totalPages);
          if (
            newest.status !== "ready" ||
            !Array.isArray(newest.tokens) ||
            newest.tokens.length < 1 ||
            newest.page !== 1 ||
            newest.pageSize !== newestPageSize ||
            !Number.isSafeInteger(newestTotal) ||
            newestTotal < 1 ||
            newestTotal > 10_000 ||
            !Number.isSafeInteger(newestTotalPages) ||
            newestTotalPages < 1 ||
            newestTotalPages > 100 ||
            newestTotalPages !== Math.ceil(newestTotal / newestPageSize)
          ) {
            throw new Error("staged Bitquery newest page is not populated");
          }
          const newestTokens = [];
          const seenNewestIds = new Set();
          for (let pageNumber = 1; pageNumber <= newestTotalPages; pageNumber += 1) {
            const page = pageNumber === 1
              ? newest
              : await requestJson(
                   `/api/explore?limit=${newestPageSize}&page=${pageNumber}&sort=newest`,
                   bitqueryMarketContract,
                 );
            if (
              page.status !== "ready" ||
              page.page !== pageNumber ||
              page.pageSize !== newestPageSize ||
              page.total !== newestTotal ||
              page.totalPages !== newestTotalPages ||
              !Array.isArray(page.tokens) ||
              page.tokens.length < 1
            ) {
              throw new Error("staged Bitquery newest pagination is not stable");
            }
            for (const entry of page.tokens) {
              if (typeof entry?.id !== "string" || seenNewestIds.has(entry.id)) {
                throw new Error("staged Bitquery newest pagination is not unique");
              }
              seenNewestIds.add(entry.id);
              newestTokens.push(entry);
            }
          }
          if (newestTokens.length !== newestTotal) {
            throw new Error("staged Bitquery newest pagination is incomplete");
          }
          const newestChainId = String(newest.snapshot?.chainId ?? "");
          if (!/^(?:0|[1-9][0-9]*)$/.test(newestChainId)) {
            throw new Error("staged Bitquery newest snapshot has no canonical chain");
          }
          const launchChainId = (entry) => {
            const value = entry.exploreKind === "token"
              ? String(entry.id).split(":", 1)[0]
              : entry.exploreKind === "custom-project"
                ? String(entry.chainId ?? "")
                : "";
            if (!/^(?:0|[1-9][0-9]*)$/.test(value)) {
              throw new Error("staged Bitquery newest entry has no canonical chain");
            }
            return value;
          };
          const launchOrder = (entry) => {
            const coordinates = entry.exploreKind === "token"
              ? [
                  entry.launchBlockNumber,
                  entry.launchTransactionIndex,
                  entry.launchLogIndex,
                ]
              : entry.exploreKind === "custom-project" &&
                  entry.launchCategoryProvenance?.category === "custom"
                ? [
                    entry.launchCategoryProvenance.blockNumber,
                    entry.launchCategoryProvenance.transactionIndex,
                    entry.launchCategoryProvenance.logIndex,
                  ]
                : null;
            if (coordinates === null || coordinates.length !== 3) {
              throw new Error(
                "staged Bitquery newest entry has no canonical launch order",
              );
            }
            return coordinates.map((value) => {
              const normalized = String(value ?? "");
              if (!/^(?:0|[1-9][0-9]*)$/.test(normalized)) {
                throw new Error(
                  "staged Bitquery newest entry has no canonical launch order",
                );
              }
              return BigInt(normalized);
            });
          };
          const launchTime = (entry) => {
            const value = Date.parse(entry.launchedAt ?? "");
            if (!Number.isFinite(value)) {
              throw new Error("staged Bitquery newest entry has no canonical time");
            }
            return value;
          };
          for (const entry of newestTokens) {
            if (launchChainId(entry) !== newestChainId) {
              throw new Error("staged Bitquery newest entry is on another chain");
            }
            launchOrder(entry);
            launchTime(entry);
          }
          for (let index = 1; index < newestTokens.length; index += 1) {
            const previous = newestTokens[index - 1];
            const current = newestTokens[index];
            const previousOrder = launchOrder(previous);
            const currentOrder = launchOrder(current);
            if (
              launchTime(current) > launchTime(previous) ||
              currentOrder.some(
                (value, offset) =>
                  value > previousOrder[offset] &&
                  currentOrder.slice(0, offset).every(
                    (prefix, prefixOffset) =>
                      prefix === previousOrder[prefixOffset],
                  ),
              )
            ) {
              throw new Error("staged Bitquery newest page is not ordered newest-first");
            }
          }
          const oldest = await requestJson(
            `/api/explore?limit=${newestPageSize}&page=1&sort=oldest`,
            bitqueryMarketContract,
          );
          const expectedOldestIds = newestTokens
            .slice(-newestPageSize)
            .reverse()
            .map((entry) => entry.id);
          if (
            oldest.status !== "ready" ||
            oldest.total !== newestTotal ||
            oldest.totalPages !== newestTotalPages ||
            !Array.isArray(oldest.tokens) ||
            oldest.tokens.map((entry) => entry.id).join("\n") !==
              expectedOldestIds.join("\n")
          ) {
            throw new Error("staged Bitquery oldest page is not ordered oldest-first");
          }
          const incrementalLaunchAddress =
            "0x468505087c2dfec4779f2d6a5f8481f03e32e905";
          const incrementalDetail = await requestJson(
            `/api/explore/token?address=${encodeURIComponent(incrementalLaunchAddress)}`,
            bitqueryMarketContract,
          );
          const incrementalLaunch = incrementalDetail.token;
          const incrementalLaunchBlock = BigInt(
            incrementalLaunch?.launchBlockNumber ?? "-1",
          );
          const durableBlock = BigInt(
            incrementalDetail.snapshot?.blockNumber ?? "-1",
          );
          const launchCursorBlock = BigInt(
            incrementalDetail.launchDiscoverySnapshot?.blockNumber ?? "-1",
          );
          if (
            incrementalDetail.status !== "ready" ||
            incrementalLaunch?.tokenAddress?.toLowerCase() !==
              incrementalLaunchAddress ||
            launchCursorBlock < incrementalLaunchBlock ||
            (
              incrementalLaunch.launchDiscoverySource !==
                "alchemy-launch-overlay" &&
              durableBlock < incrementalLaunchBlock
            )
          ) {
            throw new Error(
              "staged Bitquery Explore did not recover the incremental launch cursor",
            );
          }
          const tokenDetail = await requestJson(
            `/api/explore/token?address=${encodeURIComponent(releaseToken.tokenAddress)}`,
            bitqueryMarketContract,
          );
          if (
            tokenDetail.status !== "ready" ||
            tokenDetail.token?.tokenAddress?.toLowerCase() !==
              releaseToken.tokenAddress.toLowerCase()
          ) {
            throw new Error("staged Bitquery token lookup did not resolve the Explore token");
          }
          if (currentFdvToken !== null) {
            const currentFdvDetail = await requestJson(
              `/api/explore/token?address=${encodeURIComponent(currentFdvToken.tokenAddress)}`,
              bitqueryMarketContract,
            );
            if (
              currentFdvDetail.token?.valuation?.status !== "available" ||
              currentFdvDetail.token.valuation.metric !== "fdv" ||
              currentFdvDetail.token.valuation.supplyBasis !== "total" ||
              currentFdvDetail.token.valuation.freshness !== "current" ||
              currentFdvDetail.token.valuation.valueWad !==
                currentFdvToken.valuation.valueWad ||
              currentFdvDetail.token.valuation.asOfTime !==
                currentFdvToken.valuation.asOfTime ||
              currentFdvDetail.token.fdvUsdWad !==
                currentFdvToken.fdvUsdWad ||
              currentFdvDetail.__marketHeaders?.marketAsOf !==
                currentFdvDetail.token.valuation.asOfTime ||
              currentFdvDetail.__marketHeaders?.priceSource !== "bitquery"
            ) {
              throw new Error(
                "staged Bitquery current Explore and detail FDV are not identical",
              );
            }
          }
          const goldenSearch = await requestJson(
            `/api/explore?limit=20&page=1&q=${goldenTokenAddress}&sort=market-cap`,
            bitqueryMarketContract,
          );
          if (
            goldenSearch.status !== "ready" ||
            !Array.isArray(goldenSearch.tokens) ||
            goldenSearch.tokens.some(
              (token) => token?.tokenAddress?.toLowerCase() === goldenTokenAddress,
            ) ||
            goldenSearch.total !== 0
          ) {
            throw new Error("staged Explore exposed the non-public PCAN release canary");
          }
          const goldenDetail = await requestJson(
            `/api/explore/token?address=${goldenTokenAddress}`,
            bitqueryMarketContract,
          );
          const goldenMarket = goldenDetail.token?.marketData;
          const goldenPool = goldenMarket?.pools?.find(
            (pool) => pool.identity?.poolId === goldenPoolId,
          );
          const goldenPrice = positiveInteger(
              goldenPool?.latestTrade?.priceUsdWad,
            )
            ? BigInt(goldenPool.latestTrade.priceUsdWad)
            : null;
          const goldenSupply = positiveDecimalToWad(
            goldenDetail.token?.valuation?.status === "available"
              ? goldenPool?.valuation?.totalSupply
              : null,
          );
          const expectedGoldenFdv = goldenPrice !== null && goldenSupply !== null
            ? (goldenPrice * goldenSupply) / 10n ** 18n
            : null;
          const goldenValuation = goldenDetail.token?.valuation;
          if (
            goldenDetail.status !== "ready" ||
            goldenDetail.token?.tokenAddress?.toLowerCase() !==
              goldenTokenAddress ||
            goldenMarket?.schemaVersion !== "programmable.market-data.v1" ||
            goldenMarket?.source !== "bitquery" ||
            goldenMarket?.primaryPoolId !== goldenPoolId ||
            !currentMarketTime(goldenMarket?.generatedAt) ||
            goldenDetail.dataQuality?.schemaVersion !==
              "programmable.explore-data-quality.v1" ||
            goldenDetail.__marketHeaders?.dataQuality !==
              goldenDetail.dataQuality.status ||
            !["complete", "partial", "stale"].includes(
              goldenDetail.dataQuality.status,
            ) ||
            !["current", "stale"].includes(goldenMarket?.status) ||
            !["current", "stale"].includes(goldenPool?.status) ||
            goldenValuation?.status !== "available" ||
            goldenValuation.source !== "bitquery" ||
            goldenValuation.metric !== "fdv" ||
            goldenValuation.supplyBasis !== "total" ||
            !["current", "stale"].includes(goldenValuation.freshness) ||
            !validMarketTime(goldenValuation.asOfTime) ||
            (goldenValuation.freshness === "current" &&
              !currentMarketTime(goldenValuation.asOfTime)) ||
            goldenPool?.valuation?.metric !== "fdv" ||
            goldenPool?.valuation?.marketCapUsdWad !== undefined ||
            expectedGoldenFdv === null ||
            expectedGoldenFdv <= 0n ||
            goldenPool?.valuation?.fdvUsdWad !== expectedGoldenFdv.toString() ||
            goldenValuation.valueWad !== expectedGoldenFdv.toString() ||
            goldenDetail.__marketHeaders?.marketAsOf !== goldenValuation.asOfTime ||
            (goldenValuation.freshness === "current"
              ? goldenDetail.__marketHeaders?.priceSource !== "bitquery"
              : goldenDetail.__marketHeaders?.priceSource !== null) ||
            (goldenValuation.freshness === "current"
              ? goldenDetail.token.fdvUsdWad !== goldenValuation.valueWad
              : goldenDetail.token.fdvUsdWad !== undefined)
          ) {
            throw new Error("staged PCAN market valuation is not Bitquery-bound");
          }
          const goldenParity = await verifyBitqueryGoldenMarketParityV1({
            token: goldenDetail.token,
          });
          const goldenChart = await requestJson(
            `/api/explore/token/chart?address=${goldenTokenAddress}&range=all`,
            bitqueryChartContract,
          );
          if (
            goldenChart.schemaVersion !== "programmable.market-chart.v1" ||
            goldenChart.source !== "bitquery" ||
            goldenChart.readStatus !== "live" ||
            !currentMarketTime(goldenChart.generatedAt) ||
            goldenChart.address?.toLowerCase() !== goldenTokenAddress ||
            goldenChart.identity?.chainId !== "1" ||
            goldenChart.identity?.tokenAddress?.toLowerCase() !==
              goldenTokenAddress ||
            goldenChart.identity?.poolId !== goldenPoolId ||
            goldenChart.identity?.quoteAddress !== goldenQuoteAddress ||
            goldenChart.identity?.protocol !== "uniswap_v4" ||
            !["ready", "insufficient-history", "partial"].includes(
              goldenChart.status,
            ) ||
            !Array.isArray(goldenChart.points) ||
            goldenChart.points.length < 1 ||
            goldenChart.valuation?.status !== "unavailable" ||
            goldenChart.valuation?.reason !== "source-unavailable" ||
            "fdvUsdWad" in goldenChart ||
            "valuationMetric" in goldenChart ||
            goldenChart.asOfTime !== goldenChart.points.at(-1)?.observedAt ||
            goldenChart.__marketHeaders?.marketAsOf !== goldenChart.asOfTime ||
            goldenChart.__marketHeaders?.dataQuality !== goldenChart.status ||
            goldenChart.__marketHeaders?.priceSource !== "bitquery" ||
            !validMarketTime(goldenChart.asOfTime)
          ) {
            throw new Error("staged PCAN price history is not Bitquery-bound");
          }
          let previousChartTime = null;
          let previousChartBlock = null;
          for (const point of goldenChart.points) {
            const time = Date.parse(point?.time ?? "");
            const bucketStart = Date.parse(point?.bucketStart ?? "");
            const bucketEnd = Date.parse(point?.bucketEnd ?? "");
            const observedAt = Date.parse(point?.observedAt ?? "");
            const block = positiveInteger(point?.blockNumber)
              ? BigInt(point.blockNumber)
              : null;
            const price = point?.priceUsd ?? point?.priceQuote;
            const numericPrice = Number(price);
            if (
              !Number.isFinite(time) ||
              point?.valueSemantics !== "period-median" ||
              !Number.isFinite(bucketStart) ||
              !Number.isFinite(bucketEnd) ||
              !Number.isFinite(observedAt) ||
              time !== bucketEnd ||
              bucketStart >= bucketEnd ||
              observedAt < bucketStart ||
              observedAt > bucketEnd ||
              block === null ||
              !Number.isFinite(numericPrice) ||
              numericPrice <= 0 ||
              (previousChartTime !== null && time <= previousChartTime) ||
              (previousChartBlock !== null && block < previousChartBlock)
            ) {
              throw new Error(
                "staged PCAN chart is not a strictly ordered positive history",
              );
            }
            previousChartTime = time;
            previousChartBlock = block;
          }
          const historicalGoldenRelease =
            verifyBitqueryHistoricalGoldenReleaseV1({
              detailToken: goldenDetail.token,
              chart: goldenChart,
              parity: goldenParity,
            });
          const historicalPaidPathVerified =
            historicalGoldenRelease.schemaVersion ===
              "programmable.bitquery-historical-release.v1" &&
            historicalGoldenRelease.tokenAddress === goldenTokenAddress &&
            historicalGoldenRelease.poolId === goldenPoolId &&
            historicalGoldenRelease.blockNumber ===
              goldenPool.latestTrade.blockNumber &&
            historicalGoldenRelease.bitqueryFdvUsdWad ===
              goldenValuation.valueWad &&
            historicalGoldenRelease.confirmations >= 12 &&
            goldenChart.points.length >= 1 &&
            goldenChart.readStatus === "live" &&
            currentMarketTime(goldenChart.generatedAt) &&
            goldenChart.__marketHeaders?.dataQuality === goldenChart.status &&
            goldenChart.__marketHeaders?.marketSource === "bitquery" &&
            goldenChart.__marketHeaders?.priceSource === "bitquery";
          process.stdout.write(
            `${JSON.stringify({
              status: "verified-bitquery-staged-market-apis",
              tokenAddress: releaseToken.tokenAddress,
              goldenTokenAddress,
              goldenPoolId,
              goldenParity,
              historicalGoldenRelease,
              historicalPaidPathVerified,
              currentFdvCount,
              availableFdvCount,
              staleFdvCount,
              waitingForFirstTradeCount,
              incrementalLaunchAddress,
              launchCursorBlockNumber:
                incrementalDetail.launchDiscoverySnapshot.blockNumber,
            })}\n`,
          );
          NODE

      - name: Record registry identity and Bitquery market path
        if: needs.release-gate.outputs.verified_read_model == 'true' && steps.read-model-policy.outputs.mode == 'alchemy-only'
        run: |
          {
            echo "## Read-model release policy"
            echo
            echo "Router and Registry remain the launch-identity authority."
            echo "Explore, token detail and charts use verified Bitquery market data; token identities do not disappear when market data is unavailable."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture staged read-model evidence
        id: read-model-capture
        if: needs.release-gate.outputs.verified_read_model == 'true' && steps.read-model-policy.outputs.mode == 'indexed-or-shadow'
        env:
          PROGRAMMABLE_PERFORMANCE_PROBE_TOKEN: ${{ secrets.PROGRAMMABLE_PERFORMANCE_PROBE_TOKEN }}
          PROGRAMMABLE_SHADOW_PROBE_TOKEN: ${{ secrets.PROGRAMMABLE_SHADOW_PROBE_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PROGRAMMABLE_READ_MODEL_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PROGRAMMABLE_READ_MODEL_VERCEL_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
        run: >-
          npm run perf:read-model:capture --
          --target-url "$PROGRAMMABLE_READ_MODEL_TARGET_URL"
          --deployment-id "$PROGRAMMABLE_READ_MODEL_VERCEL_DEPLOYMENT_ID"
          --output-directory "$RUNNER_TEMP/read-model-release-evidence"
          --kind production-canary
          --github-output "$GITHUB_OUTPUT"

      - name: Preserve staged read-model evidence
        if: needs.release-gate.outputs.verified_read_model == 'true' && steps.read-model-policy.outputs.mode == 'indexed-or-shadow'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: read-model-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.read-model-capture.outputs.evidence_directory }}
          if-no-files-found: error
          retention-days: 7

      - name: Gate indexed or shadow read path
        if: needs.release-gate.outputs.verified_read_model == 'true' && steps.read-model-policy.outputs.mode == 'indexed-or-shadow'
        env:
          PROGRAMMABLE_READ_MODEL_PERF_EVIDENCE_PATH: ${{ steps.read-model-capture.outputs.evidence_path }}
          PROGRAMMABLE_READ_MODEL_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PROGRAMMABLE_READ_MODEL_VERCEL_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT }}
          PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npm run perf:read-model:gate

      - name: Reverify staged candidate binding
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
        run: |
          binding_output="$RUNNER_TEMP/final-staged-binding"
          test ! -e "$binding_output"
          npm run perf:read-model:staged-deployment -- \
            --target-url "$STAGED_TARGET_URL" \
            --github-output "$binding_output"
          grep -Fx "deployment_id=$EXPECTED_DEPLOYMENT_ID" "$binding_output"
          grep -Fx "target_url=$STAGED_TARGET_URL" "$binding_output"

      - name: Record staged candidate handoff
        env:
          DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.production-before.outputs.deployment_id }}
          PREVIOUS_GIT_HEAD: ${{ steps.production-before.outputs.git_head }}
          POLICY_MODE: ${{ steps.read-model-policy.outputs.mode }}
          READ_MODEL_REQUIRED: ${{ needs.release-gate.outputs.verified_read_model }}
        run: |
          {
            echo "## Staged production candidate"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Deployment ID: \`$DEPLOYMENT_ID\`"
            echo "- Target: $STAGED_TARGET_URL"
            echo "- Previous production deployment: \`$PREVIOUS_DEPLOYMENT_ID\`"
            echo "- Previous production commit: \`$PREVIOUS_GIT_HEAD\`"
            echo "- Read model: ${{ steps.read-model-policy.outputs.mode }}"
            echo "- Read-model verification required by this commit: \`$READ_MODEL_REQUIRED\`"
            echo
            echo "Stage-only: no production promotion was attempted."
            if [ "$READ_MODEL_REQUIRED" != "true" ]; then
              echo "This source-only UI/docs candidate leaves read-model bytes unchanged; the provider-specific release lane was not rerun."
              echo "Before any separately authorized promotion, reverify this exact staged deployment ID and commit binding."
            elif [ "$POLICY_MODE" = "indexed-or-shadow" ]; then
              echo "The manual operator must next capture and verify the DB-authored real-block SLA attestation, reverify this exact staged binding, promote this exact deployment ID, and run the post-promotion binding gate."
            elif [ "$POLICY_MODE" = "alchemy-only" ]; then
              echo "Before any separately authorized promotion, reverify this exact staged deployment ID and commit binding."
            else
              echo "Unrecognized staged release policy mode" >&2
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"
