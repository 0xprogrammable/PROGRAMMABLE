name: Stage Production Candidate

on:
  workflow_dispatch:
    inputs:
      custom_launch_public_enablement:
        description: Require the detached Custom Launch release record and stage an enabled candidate
        required: true
        default: false
        type: boolean
      custom_launch_dark_release:
        description: Require the detached Custom Launch release record and stage a disabled dark candidate
        required: true
        default: false
        type: boolean
      custom_launch_release_record_commit_sha:
        description: Exact commit on command-center-release-records containing the detached record
        required: false
        default: ""
        type: string
      custom_launch_release_record_sha256:
        description: Canonical detached record SHA-256 printed by the verifier
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: programmable-production
  cancel-in-progress: false

jobs:
  release-gate:
    name: Consume exact full production Verify proof
    if: >-
      github.repository == '0xprogrammable/programmable' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/production'
    permissions:
      actions: read
      attestations: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verified_sha: ${{ steps.verify-proof.outputs.verified_sha }}
      verified_tree: ${{ steps.verify-proof.outputs.verified_tree }}
      verify_run_id: ${{ steps.verify-proof.outputs.verify_run_id }}
      verify_run_attempt: ${{ steps.verify-proof.outputs.verify_run_attempt }}
      artifact_id: ${{ steps.resolve-proof.outputs.artifact_id }}
      proof_sha256: ${{ steps.verify-proof.outputs.proof_sha256 }}
      artifact_digest: ${{ steps.verify-proof.outputs.artifact_digest }}
      verified_contracts: ${{ steps.verify-proof.outputs.verified_contracts }}
      verified_database: ${{ steps.verify-proof.outputs.verified_database }}
      verified_dependencies: ${{ steps.verify-proof.outputs.verified_dependencies }}
      verified_indexer: ${{ steps.verify-proof.outputs.verified_indexer }}
      verified_interface: ${{ steps.verify-proof.outputs.verified_interface }}
      verified_read_model: ${{ steps.verify-proof.outputs.verified_read_model }}

    steps:
      - name: Check out exact production commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0

      - name: Resolve latest exact full production Verify proof
        id: resolve-proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/production-verify-proof.mjs resolve
          --repository-root "$GITHUB_WORKSPACE"
          --github-output "$GITHUB_OUTPUT"

      - name: Download exact immutable production Verify proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve-proof.outputs.artifact_id }}
          path: ${{ runner.temp }}/production-verify-proof
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve-proof.outputs.verify_run_id }}
          digest-mismatch: error

      - name: Verify Sigstore provenance and exact proof contents
        id: verify-proof
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIGEST: ${{ steps.resolve-proof.outputs.artifact_digest }}
          VERIFY_RUN_ID: ${{ steps.resolve-proof.outputs.verify_run_id }}
          VERIFY_RUN_ATTEMPT: ${{ steps.resolve-proof.outputs.verify_run_attempt }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/production-verify-proof/production-verify-proof.json"
          attestation_result="$RUNNER_TEMP/production-verify-attestation.json"
          test -f "$proof"
          gh attestation verify "$proof" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/verify.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json > "$attestation_result"
          ATTESTATION_RESULT="$attestation_result" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync(process.env.ATTESTATION_RESULT, "utf8"));
            if (!Array.isArray(result) || result.length < 1) {
              throw new Error("No valid production Verify attestation was returned");
            }
          '
          node scripts/production-verify-proof.mjs verify \
            --repository-root "$GITHUB_WORKSPACE" \
            --proof "$proof" \
            --run-id "$VERIFY_RUN_ID" \
            --run-attempt "$VERIFY_RUN_ATTEMPT" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --github-output "$GITHUB_OUTPUT"

      - name: Record consumed production Verify proof
        env:
          VERIFY_RUN_URL: ${{ steps.resolve-proof.outputs.verify_run_url }}
          PROOF_COMPLETED_AT: ${{ steps.resolve-proof.outputs.proof_completed_at }}
          PROOF_SHA256: ${{ steps.verify-proof.outputs.proof_sha256 }}
          ARTIFACT_DIGEST: ${{ steps.verify-proof.outputs.artifact_digest }}
        run: |
          {
            echo "## Consumed production Verify proof"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Verify run: $VERIFY_RUN_URL"
            echo "- Proof completed: \`$PROOF_COMPLETED_AT\`"
            echo "- Proof SHA-256: \`$PROOF_SHA256\`"
            echo "- Immutable artifact digest: \`$ARTIFACT_DIGEST\`"
            echo "- Read-model lane required: \`${{ steps.verify-proof.outputs.verified_read_model }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Stage programmable.market candidate
    needs: release-gate
    if: >-
      github.repository == '0xprogrammable/programmable' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/production' &&
      needs.release-gate.outputs.verified_sha == github.sha
    permissions:
      actions: read
      attestations: read
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out production
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release-gate.outputs.verified_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Revalidate exact Verify proof after production approval
        id: revalidate-proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/production-verify-proof.mjs resolve
          --repository-root "$GITHUB_WORKSPACE"
          --github-output "$GITHUB_OUTPUT"

      - name: Confirm consumed Verify proof identity after production approval
        env:
          EXPECTED_SHA: ${{ needs.release-gate.outputs.verified_sha }}
          EXPECTED_TREE: ${{ needs.release-gate.outputs.verified_tree }}
          EXPECTED_RUN_ID: ${{ needs.release-gate.outputs.verify_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.release-gate.outputs.verify_run_attempt }}
          EXPECTED_ARTIFACT_ID: ${{ needs.release-gate.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.release-gate.outputs.artifact_digest }}
          REVALIDATED_SHA: ${{ steps.revalidate-proof.outputs.verified_sha }}
          REVALIDATED_TREE: ${{ steps.revalidate-proof.outputs.verified_tree }}
          REVALIDATED_RUN_ID: ${{ steps.revalidate-proof.outputs.verify_run_id }}
          REVALIDATED_RUN_ATTEMPT: ${{ steps.revalidate-proof.outputs.verify_run_attempt }}
          REVALIDATED_ARTIFACT_ID: ${{ steps.revalidate-proof.outputs.artifact_id }}
          REVALIDATED_ARTIFACT_DIGEST: ${{ steps.revalidate-proof.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$REVALIDATED_SHA" = "$EXPECTED_SHA"
          test "$REVALIDATED_TREE" = "$EXPECTED_TREE"
          test "$REVALIDATED_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$REVALIDATED_RUN_ATTEMPT" = "$EXPECTED_RUN_ATTEMPT"
          test "$REVALIDATED_ARTIFACT_ID" = "$EXPECTED_ARTIFACT_ID"
          test "$REVALIDATED_ARTIFACT_DIGEST" = "$EXPECTED_ARTIFACT_DIGEST"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@54.1.0

      - name: Pull production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Resolve Custom Launch release-record policy
        id: custom-launch-policy
        env:
          CUSTOM_LAUNCH_PUBLIC_ENABLEMENT_REQUESTED: ${{ inputs.custom_launch_public_enablement }}
          CUSTOM_LAUNCH_DARK_RELEASE_REQUESTED: ${{ inputs.custom_launch_dark_release }}
          CUSTOM_LAUNCH_PRODUCTION_MODE: ${{ vars.CUSTOM_LAUNCH_PRODUCTION_MODE }}
        run: >-
          node scripts/resolve-custom-launch-staging-policy.mjs
          --env-file .vercel/.env.production.local
          --requested "$CUSTOM_LAUNCH_PUBLIC_ENABLEMENT_REQUESTED"
          --dark-release-requested "$CUSTOM_LAUNCH_DARK_RELEASE_REQUESTED"
          --production-mode "$CUSTOM_LAUNCH_PRODUCTION_MODE"
          --github-output "$GITHUB_OUTPUT"

      - name: Capture sensitive production environment metadata
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          umask 077
          set -o pipefail
          vercel env ls production --format json --token="$VERCEL_TOKEN" | \
            node scripts/bind-vercel-sensitive-production-metadata.mjs \
            --output-file "$RUNNER_TEMP/vercel-production-env-metadata.json" \
            --vercel-project-id "$VERCEL_PROJECT_ID"

      - name: Capture current production rollback target
        id: production-before
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npm run perf:read-model:production-binding --
          --target-url "https://programmable.market"
          --reject-git-head "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify detached Custom Launch release record
        id: custom-launch-record
        if: steps.custom-launch-policy.outputs.release_record_required == 'true'
        env:
          RECORD_COMMIT_SHA: ${{ inputs.custom_launch_release_record_commit_sha }}
          RECORD_VERIFICATION_LEVEL: ${{ steps.custom-launch-policy.outputs.release_record_verification_level }}
          EXPECTED_RECORD_SHA256: ${{ inputs.custom_launch_release_record_sha256 }}
          EXPECTED_PACKAGE_ARTIFACT_HASH: ${{ secrets.PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH }}
          EXPECTED_CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA: ${{ vars.PROGRAMMABLE_BACKEND_CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA }}
          EXPECTED_CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256: ${{ vars.PROGRAMMABLE_BACKEND_CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256 }}
          PROGRAMMABLE_BACKEND_RELEASE_READ_TOKEN: ${{ secrets.PROGRAMMABLE_BACKEND_RELEASE_READ_TOKEN }}
          COMMAND_CENTER_GITHUB_TOKEN: ${{ github.token }}
          ROLLBACK_DEPLOYMENT_ID: ${{ steps.production-before.outputs.deployment_id }}
          ROLLBACK_DEPLOYMENT_URL: ${{ steps.production-before.outputs.deployment_url }}
          ROLLBACK_WEBSITE_COMMIT_SHA: ${{ steps.production-before.outputs.git_head }}
        run: |
          set -euo pipefail
          if [[ ! "$RECORD_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Custom Launch requires one exact detached-record commit" >&2
            exit 1
          fi
          if [[ "$RECORD_COMMIT_SHA" == "$GITHUB_SHA" ]]; then
            echo "The detached record must not be stored in its Website subject commit" >&2
            exit 1
          fi
          case "$RECORD_VERIFICATION_LEVEL" in
            staging|dark-staging) ;;
            *)
              echo "Custom Launch release-record verification level is invalid" >&2
              exit 1
              ;;
          esac
          record_ref="refs/remotes/origin/command-center-release-records"
          record_path="release-records/custom-launch-v1/release-record.json"
          record_file="$RUNNER_TEMP/custom-launch-release-record.json"
          test ! -e "$record_file"
          umask 077
          git fetch --no-tags origin \
            "+refs/heads/command-center-release-records:$record_ref"
          git cat-file -e "$RECORD_COMMIT_SHA^{commit}"
          git merge-base --is-ancestor "$RECORD_COMMIT_SHA" "$record_ref"
          test "$(git show -s --format=%ae "$RECORD_COMMIT_SHA")" = \
            "309941960+0xprogrammable@users.noreply.github.com"
          record_commit_json="$RUNNER_TEMP/custom-launch-release-record-commit.json"
          test ! -e "$record_commit_json"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $COMMAND_CENTER_GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$record_commit_json" \
            "https://api.github.com/repos/0xprogrammable/programmable/commits/$RECORD_COMMIT_SHA"
          RECORD_COMMIT_JSON="$record_commit_json" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const commit = JSON.parse(readFileSync(process.env.RECORD_COMMIT_JSON, "utf8"));
          if (
            commit.sha !== process.env.RECORD_COMMIT_SHA ||
            commit.author?.login !== "0xprogrammable" ||
            commit.committer?.login !== "0xprogrammable" ||
            commit.commit?.verification?.verified !== true
          ) {
            throw new Error("detached record commit lacks verified Programmable provenance");
          }
          NODE
          git show "$RECORD_COMMIT_SHA:$record_path" > "$record_file"
          attestation_summary_file="$RUNNER_TEMP/custom-launch-cross-repository-attestation.json"
          test ! -e "$attestation_summary_file"
          node scripts/verify-custom-launch-release-record.mjs "$record_file" \
            --require "$RECORD_VERIFICATION_LEVEL" \
            --verify-cross-repository-attestation \
            --cross-repository-attestation-summary "$attestation_summary_file" \
            --expect-website-commit "$GITHUB_SHA" \
            --expect-package-artifact-hash "$EXPECTED_PACKAGE_ARTIFACT_HASH" \
            --expect-cross-repository-attestation-commit "$EXPECTED_CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA" \
            --expect-cross-repository-binding-document-sha256 "$EXPECTED_CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256" \
            --expect-rollback-deployment-id "$ROLLBACK_DEPLOYMENT_ID" \
            --expect-rollback-deployment-url "$ROLLBACK_DEPLOYMENT_URL" \
            --expect-rollback-website-commit "$ROLLBACK_WEBSITE_COMMIT_SHA" \
            --expect-detached-record-sha256 "$EXPECTED_RECORD_SHA256" \
            --github-output "$GITHUB_OUTPUT"

      - name: Preserve detached Custom Launch release record
        if: steps.custom-launch-policy.outputs.release_record_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-launch-release-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/custom-launch-release-record.json
            ${{ runner.temp }}/custom-launch-cross-repository-attestation.json
          if-no-files-found: error
          retention-days: 90

      - name: Record Custom Launch release gate
        if: steps.custom-launch-policy.outputs.release_record_required == 'true'
        env:
          RECORD_COMMIT_SHA: ${{ inputs.custom_launch_release_record_commit_sha }}
        run: |
          {
            echo "## Custom Launch release record"
            echo
            echo "- Record commit: \`$RECORD_COMMIT_SHA\`"
            echo "- Release subject: \`${{ steps.custom-launch-record.outputs.release_subject_sha256 }}\`"
            echo "- Detached record: \`${{ steps.custom-launch-record.outputs.detached_record_sha256 }}\`"
            echo "- Backend cross-repository attestation: \`${{ steps.custom-launch-record.outputs.cross_repository_attestation_commit_sha }}\`"
            echo "- Backend binding document: \`${{ steps.custom-launch-record.outputs.cross_repository_binding_document_sha256 }}\`"
            echo "- Review authority: \`${{ steps.custom-launch-record.outputs.review_authority_mode }}\`"
            echo "- Gate: \`${{ steps.custom-launch-policy.outputs.release_record_verification_level }}\` only"
            echo "- Stage mode: \`${{ steps.custom-launch-policy.outputs.staging_mode }}\`"
            echo
            echo "No promotion is authorized by this staging gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve read-model release policy
        id: read-model-policy
        env:
          PROGRAMMABLE_WEBSITE_MAINNET_RPC_PRIMARY_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_WEBSITE_MAINNET_RPC_PRIMARY_ENDPOINT_COMMITMENT }}
          PROGRAMMABLE_WEBSITE_MAINNET_RPC_SECONDARY_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_WEBSITE_MAINNET_RPC_SECONDARY_ENDPOINT_COMMITMENT }}
        run: >-
          npm run perf:read-model:deploy-policy --
          --env-file .vercel/.env.production.local
          --sensitive-env-metadata "$RUNNER_TEMP/vercel-production-env-metadata.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Build production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Stage production build without assigning domains
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROGRAMMABLE_WEBSITE_MAINNET_RPC_PRIMARY_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_WEBSITE_MAINNET_RPC_PRIMARY_ENDPOINT_COMMITMENT }}
          PROGRAMMABLE_WEBSITE_MAINNET_RPC_SECONDARY_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_WEBSITE_MAINNET_RPC_SECONDARY_ENDPOINT_COMMITMENT }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain --archive=tgz --meta githubCommitSha="$GITHUB_SHA" --env VERCEL_GIT_COMMIT_SHA="$GITHUB_SHA" --env PROGRAMMABLE_RELEASE_COMMIT_SHA="$GITHUB_SHA" --env PROGRAMMABLE_WEBSITE_MAINNET_RPC_PRIMARY_ENDPOINT_COMMITMENT="$PROGRAMMABLE_WEBSITE_MAINNET_RPC_PRIMARY_ENDPOINT_COMMITMENT" --env PROGRAMMABLE_WEBSITE_MAINNET_RPC_SECONDARY_ENDPOINT_COMMITMENT="$PROGRAMMABLE_WEBSITE_MAINNET_RPC_SECONDARY_ENDPOINT_COMMITMENT" --token="$VERCEL_TOKEN")"
          case "$deployment_url" in
            https://*) ;;
            *)
              echo "Vercel did not return a deployment URL" >&2
              exit 1
              ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Resolve exact staged deployment
        id: staged-deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: >-
          npm run perf:read-model:staged-deployment --
          --target-url "$DEPLOYMENT_URL"
          --github-output "$GITHUB_OUTPUT"

      - name: Gate exact staged Custom Launch candidate
        id: custom-launch-canary
        if: steps.custom-launch-policy.outputs.staging_mode == 'enabled'
        env:
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PROGRAMMABLE_RELEASE_EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH: ${{ secrets.PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_REVIEW_AUTHORITY_MODE: ${{ steps.custom-launch-record.outputs.review_authority_mode }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_ACCESS_TOKEN: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_ACCESS_TOKEN }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_IDENTITY_TOKEN: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_IDENTITY_TOKEN }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_EXPECTED_GITHUB_USER_ID: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_EXPECTED_GITHUB_USER_ID }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_OWN_APPLICATION_HANDLE: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_OWN_APPLICATION_HANDLE }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_FOREIGN_APPLICATION_HANDLE: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_FOREIGN_APPLICATION_HANDLE }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          deployment_host="$(node --input-type=module -e '
            const url = new URL(process.env.STAGED_TARGET_URL);
            if (
              url.protocol !== "https:" ||
              url.pathname !== "/" ||
              url.search !== "" ||
              url.hash !== "" ||
              !url.hostname.endsWith(".vercel.app")
            ) throw new Error("Custom Launch canary target is not an immutable Vercel origin");
            process.stdout.write(url.host);
          ')"
          export PROGRAMMABLE_RELEASE_EXPECTED_DEPLOYMENT_HOST="$deployment_host"
          npm run probe:custom-launch -- \
            "--base-url=$STAGED_TARGET_URL" \
            "--deployment-id=$STAGED_DEPLOYMENT_ID" \
            "--evidence-output=$RUNNER_TEMP/custom-launch-candidate-canary-evidence.json" \
            --require-enabled \
            --authenticated-canary
          echo "evidence_path=$RUNNER_TEMP/custom-launch-candidate-canary-evidence.json" >> "$GITHUB_OUTPUT"

      - name: Preserve redacted Custom Launch candidate evidence
        if: steps.custom-launch-policy.outputs.staging_mode == 'enabled'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-launch-candidate-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.custom-launch-canary.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Gate exact staged dark Custom Launch candidate
        id: custom-launch-dark-release
        if: steps.custom-launch-policy.outputs.staging_mode == 'dark'
        env:
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PROGRAMMABLE_RELEASE_EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH: ${{ secrets.PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_REVIEW_AUTHORITY_MODE: ${{ steps.custom-launch-record.outputs.review_authority_mode }}
          RELEASE_SUBJECT_SHA256: ${{ steps.custom-launch-record.outputs.release_subject_sha256 }}
          DETACHED_RECORD_SHA256: ${{ steps.custom-launch-record.outputs.detached_record_sha256 }}
          CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA: ${{ steps.custom-launch-record.outputs.cross_repository_attestation_commit_sha }}
          CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256: ${{ steps.custom-launch-record.outputs.cross_repository_binding_document_sha256 }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          deployment_host="$(node --input-type=module -e '
            const url = new URL(process.env.STAGED_TARGET_URL);
            if (
              url.protocol !== "https:" ||
              url.username !== "" ||
              url.password !== "" ||
              url.pathname !== "/" ||
              url.search !== "" ||
              url.hash !== "" ||
              !url.hostname.endsWith(".vercel.app")
            ) throw new Error("Custom Launch dark target is not an immutable Vercel origin");
            process.stdout.write(url.host);
          ')"
          export PROGRAMMABLE_RELEASE_EXPECTED_DEPLOYMENT_HOST="$deployment_host"
          evidence_path="$RUNNER_TEMP/custom-launch-dark-release-evidence.json"
          npm run probe:custom-launch -- \
            "--base-url=$STAGED_TARGET_URL" \
            "--deployment-id=$STAGED_DEPLOYMENT_ID" \
            "--dark-release-evidence-output=$evidence_path" \
            "--release-subject-sha256=$RELEASE_SUBJECT_SHA256" \
            "--detached-record-sha256=$DETACHED_RECORD_SHA256" \
            "--cross-repository-attestation-commit-sha=$CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA" \
            "--cross-repository-binding-document-sha256=$CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256" \
            --require-disabled
          echo "evidence_path=$evidence_path" >> "$GITHUB_OUTPUT"

      - name: Preserve redacted Custom Launch dark release evidence
        if: steps.custom-launch-policy.outputs.staging_mode == 'dark'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-launch-dark-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.custom-launch-dark-release.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Gate exact staged QuickNode wake route
        if: needs.release-gate.outputs.verified_read_model == 'true' && steps.read-model-policy.outputs.wake_canary_required == 'true'
        env:
          PROGRAMMABLE_QUICKNODE_STREAM_SECRET: ${{ secrets.PROGRAMMABLE_QUICKNODE_STREAM_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
        run: >-
          npm run perf:read-model:wake-canary --
          --target-url "$STAGED_TARGET_URL"

      - name: Attest exact staged release policy
        id: release-attestation
        env:
          PROGRAMMABLE_WEBSITE_MAINNET_RPC_PRIMARY_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_WEBSITE_MAINNET_RPC_PRIMARY_ENDPOINT_COMMITMENT }}
          PROGRAMMABLE_WEBSITE_MAINNET_RPC_SECONDARY_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_WEBSITE_MAINNET_RPC_SECONDARY_ENDPOINT_COMMITMENT }}
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          POLICY_MODE: ${{ steps.read-model-policy.outputs.mode }}
        run: >-
          npm run perf:read-model:deploy-policy --
          --env-file .vercel/.env.production.local
          --sensitive-env-metadata "$RUNNER_TEMP/vercel-production-env-metadata.json"
          --verified-sha "$GITHUB_SHA"
          --vercel-project-id "$VERCEL_PROJECT_ID"
          --staged-deployment-id "$STAGED_DEPLOYMENT_ID"
          --staged-target-url "$STAGED_TARGET_URL"
          --production-origin "https://programmable.market"
          --expected-mode "$POLICY_MODE"
          --attestation-output "$RUNNER_TEMP/staged-release-attestation.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Preserve staged release attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-release-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.release-attestation.outputs.attestation_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Record staged release attestation
        run: |
          {
            echo "## Staged release attestation"
            echo
            echo "- SHA-256: \`${{ steps.release-attestation.outputs.attestation_sha256 }}\`"
            echo "- Runtime mode: \`${{ steps.read-model-policy.outputs.mode }}\`"
            echo "- Production target: https://programmable.market"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify staged deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --max-time 30 "$DEPLOYMENT_URL/" > /dev/null

      - name: Refresh and prove exact staged durable read model
        if: needs.release-gate.outputs.verified_read_model == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          EXPECTED_GIT_HEAD: ${{ github.sha }}
        run: >-
          npm run perf:read-model:staged-refresh --
          --target-url "$STAGED_TARGET_URL"
          --deployment-id "$STAGED_DEPLOYMENT_ID"
          --git-head "$EXPECTED_GIT_HEAD"

      - name: Smoke staged public market APIs
        if: needs.release-gate.outputs.verified_read_model == 'true'
        env:
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Vercel Sensitive values are intentionally blank in env pull output.
          # Load them only into this subprocess; never persist or print the URLs.
          vercel env run --environment=production --token="$VERCEL_TOKEN" -- \
            node --input-type=module <<'NODE'
          const { verifyCurrentPublicOnchainEvidenceV1 } = await import(
            "./scripts/perf/read-model-post-promotion.mjs"
          );
          const { verifyBitqueryGoldenMarketExecutionV1 } = await import(
            "./scripts/perf/bitquery-golden-market-parity.mjs"
          );
          const {
            verifyBitqueryHistoricalGoldenReleaseV2,
          } = await import(
            "./scripts/perf/bitquery-historical-release-gate.mjs"
          );
          const { runtimeProductionProviderEndpoints } = await import(
            "./scripts/perf/read-model-provider-binding.mjs"
          );
          const goldenTokenAddress =
            "0x9deeb39d2590b0cad5fc473f755c5f97dcc8f7ce";
          const goldenPoolId =
            "0x5c5a3ebee6840640642ba2bea526621a4962d2c89c388c36a2edb4725802a229";
          const goldenQuoteAddress =
            "0x0000000000000000000000000000000000000000";
          const nativeCurrency =
            "0x0000000000000000000000000000000000000000";
          const mainnetStateView =
            "0x7ffe42c4a5deea5b0fec41c94c136cf115597227";
          const mainnetStateViewRuntimeCodeHash =
            "0xd7947778589cf4aac9a092a4451292a2056380941635ab7006d3c691d8dfd878";
          const mainnetEthUsdFeed =
            "0x5f4ec3df9cbd43714fe2740f5e3616155c5b8419";
          const officialV4SubgraphDeployment =
            "QmZsgJLiLQKpb8hxTmQ5LWyrFVvfWzVaL4WK8dfFBn7EeK";
          const officialV4SubgraphId =
            "DiYPVdygkfjDWhbxGSqAQxwBKmfKnkWQojqeM2rkLb3G";
          const currentPublicMarketSource =
            "stateview-chainlink+official-uniswap-v4-subgraph+bitquery";
          const independentRpcUrls =
            runtimeProductionProviderEndpoints(process.env);
          const minimumPublicFdvLiquidityUsdWad =
            10_000n * 10n ** 18n;
          const marketCapPageSize = 100;
          const maximumMarketCapTokens = 400;
          const origin = new URL(process.env.STAGED_TARGET_URL);
          if (
            origin.protocol !== "https:" ||
            !origin.hostname.endsWith(".vercel.app") ||
            origin.pathname !== "/" ||
            origin.search ||
            origin.hash
          ) {
            throw new Error("Bitquery smoke target is not an exact Vercel origin");
          }
          const automationBypassSecret =
            process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
          const automationBypassSecretLength = Buffer.byteLength(
            automationBypassSecret ?? "",
            "utf8",
          );
          if (
            typeof automationBypassSecret !== "string" ||
            automationBypassSecretLength < 32 ||
            automationBypassSecretLength > 512 ||
            /[\r\n]/.test(automationBypassSecret)
          ) {
            throw new Error("Bitquery smoke automation bypass is unavailable");
          }
          const bitquerySmokeRequestHeaders = Object.freeze({
            Accept: "application/json",
            "x-vercel-protection-bypass": automationBypassSecret,
          });
          const publicMarketContract = Object.freeze({
            readSources: Object.freeze(["operational+durable+postgres"]),
            rpcProviders: null,
            marketSources: Object.freeze([
              "bitquery",
              currentPublicMarketSource,
            ]),
            dataQualities: Object.freeze(["complete", "partial", "stale"]),
          });
          const currentPublicMarketContract = Object.freeze({
            readSources: Object.freeze(["operational+durable+postgres"]),
            rpcProviders: null,
            marketSources: Object.freeze([currentPublicMarketSource]),
            priceSources: Object.freeze(["stateview-chainlink"]),
            dataQualities: Object.freeze(["complete", "partial", "stale"]),
          });
          const historicalBitqueryMarketContract = Object.freeze({
            readSources: Object.freeze(["operational+durable+postgres"]),
            rpcProviders: null,
            marketSources: Object.freeze(["bitquery"]),
            priceSources: null,
            dataQualities: Object.freeze(["complete", "partial", "stale"]),
          });
          const bitqueryChartContract = Object.freeze({
            readSources: null,
            rpcProviders: null,
            marketSources: Object.freeze(["bitquery"]),
            dataQualities: Object.freeze([
              "ready",
              "insufficient-history",
              "partial",
            ]),
          });
          const unavailableValuationReasons = new Set([
            "no-market",
            "supply-unavailable",
            "liquidity-unavailable",
            "price-unavailable",
            "inconsistent-snapshot",
            "waiting-for-first-trade",
            "source-unavailable",
          ]);

          const headerMatches = (value, expected) =>
            expected === null
              ? value === null
              : expected.includes(value ?? "");
          const positiveInteger = (value) =>
            typeof value === "string" &&
            value.length <= 78 &&
            /^[1-9][0-9]*$/.test(value);
          const unsignedInteger = (value) =>
            typeof value === "string" &&
            value.length <= 78 &&
            /^(?:0|[1-9][0-9]*)$/.test(value);
          const unsignedDecimal = (value) =>
            typeof value === "string" &&
            value.length <= 160 &&
            /^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$/.test(value);
          const positiveDecimal = (value) =>
            unsignedDecimal(value) && !/^0(?:\.0+)?$/.test(value);
          const exactAddress = (value) =>
            typeof value === "string" &&
            /^0x[0-9a-f]{40}$/i.test(value);
          const exactBytes32 = (value) =>
            typeof value === "string" &&
            /^0x[0-9a-f]{64}$/i.test(value);
          const sameAddress = (left, right) =>
            exactAddress(left) &&
            exactAddress(right) &&
            left.toLowerCase() === right.toLowerCase();
          const sameBytes32 = (left, right) =>
            exactBytes32(left) &&
            exactBytes32(right) &&
            left.toLowerCase() === right.toLowerCase();
          const exactCanonicalClassicNativeToken = (
            token,
            tokenAddress,
            poolId,
          ) => {
            if (
              token?.exploreKind !== "token" ||
              token.launchModel !== "classic"
            ) return false;
            if (token.liquidityPath === "meme") {
              return token.launchStampProvenance === undefined;
            }
            const stamp = token.launchStampProvenance;
            return token.liquidityPath === "programmable-v4" &&
              stamp?.schemaVersion ===
                "programmable.launch-stamp-provenance.v1" &&
              stamp.kind === "classic" &&
              stamp.chainId === 1 &&
              sameBytes32(stamp.poolId, poolId) &&
              sameAddress(stamp.poolKey?.currency0, nativeCurrency) &&
              sameAddress(stamp.poolKey?.currency1, tokenAddress) &&
              sameAddress(stamp.poolKey?.hooks, token?.hookAddress);
          };
          const exactUnixTimestamp = (value) =>
            positiveInteger(value) && BigInt(value) <= 8_640_000_000n;
          const positiveDecimalToWad = (value) => {
            const match = /^(0|[1-9][0-9]*)(?:\.([0-9]+))?$/.exec(
              String(value ?? ""),
            );
            if (!match) return null;
            const wad = BigInt(match[1]) * 10n ** 18n +
              BigInt((match[2] ?? "").slice(0, 18).padEnd(18, "0") || "0");
            return wad > 0n ? wad : null;
          };
          const validMarketTime = (value) => {
            const parsed = Date.parse(value ?? "");
            return Number.isFinite(parsed) &&
              parsed <= Date.now() + 60_000;
          };
          const currentMarketTime = (value) =>
            validMarketTime(value) &&
            Date.now() - Date.parse(value) <= 6 * 60_000;
          const currentMarketEvidenceTime = (value) =>
            validMarketTime(value) &&
            Date.now() - Date.parse(value) <= 5 * 60_000;
          const hasUnevidencedBitqueryFdv = (
            value,
            depth = 0,
            seen = new Set(),
          ) => {
            if (depth > 12) return true;
            if (value === null || typeof value !== "object") return false;
            if (seen.has(value)) return true;
            seen.add(value);
            if (Array.isArray(value)) {
              return value.some((entry) =>
                hasUnevidencedBitqueryFdv(entry, depth + 1, seen)
              );
            }
            if (
              value.fdvUsdWad !== undefined ||
              value.marketCapUsdWad !== undefined ||
              (value.metric === "fdv" &&
                (value.status === "available" ||
                  value.valueUsdWad !== undefined))
            ) return true;
            return Object.values(value).some((entry) =>
              hasUnevidencedBitqueryFdv(entry, depth + 1, seen)
            );
          };

          const requestJson = async (path, contract) => {
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(new URL(path, origin), {
                  redirect: "error",
                  headers: bitquerySmokeRequestHeaders,
                  signal: AbortSignal.timeout(30_000),
                });
                const text = await response.text();
                if (!response.ok) {
                  throw new Error(`${path} returned ${response.status}`);
                }
                if (Buffer.byteLength(text, "utf8") > 2 * 1024 * 1024) {
                  throw new Error(`${path} returned an oversized response`);
                }
                const readSource = response.headers.get(
                  "x-programmable-read-source",
                );
                const rpcProvider = response.headers.get(
                  "x-programmable-rpc-provider",
                );
                const marketSource = response.headers.get(
                  "x-programmable-market-source",
                );
                const priceSource = response.headers.get(
                  "x-programmable-price-source",
                );
                const marketAsOf = response.headers.get(
                  "x-programmable-market-as-of",
                );
                const valuationBlock = response.headers.get(
                  "x-programmable-valuation-block",
                );
                const dataQuality = response.headers.get(
                  "x-programmable-data-quality",
                );
                if (
                  !headerMatches(readSource, contract.readSources) ||
                  !headerMatches(rpcProvider, contract.rpcProviders) ||
                  !headerMatches(marketSource, contract.marketSources) ||
                  !headerMatches(dataQuality, contract.dataQualities) ||
                  (contract.priceSources !== undefined &&
                    !headerMatches(priceSource, contract.priceSources))
                ) {
                  throw new Error(
                    `${path} did not prove its required identity and market sources`,
                  );
                }
                const body = JSON.parse(text);
                const expectedDataQuality = body?.dataQuality?.status ?? body?.status;
                if (dataQuality !== expectedDataQuality) {
                  throw new Error(`${path} has inconsistent data-quality provenance`);
                }
                Object.defineProperty(body, "__marketHeaders", {
                  value: Object.freeze({
                    dataQuality,
                    marketAsOf,
                    marketSource,
                    priceSource,
                    valuationBlock,
                  }),
                  enumerable: false,
                });
                return body;
              } catch (error) {
                lastError = error;
                if (attempt < 12) {
                  await new Promise((resolve) => setTimeout(resolve, 5_000));
                }
              }
            }
            throw lastError ?? new Error(`${path} failed`);
          };

          const exactCurrentPublicFdvLiquidity = (token) => {
            const tokenAddress = token?.tokenAddress?.toLowerCase();
            const valuation = token?.valuation;
            const market = token?.marketData;
            const primary = market?.pools?.find(
              (pool) => sameBytes32(
                pool?.identity?.poolId,
                market?.primaryPoolId,
              ),
            );
            const price = valuation?.priceEvidence;
            const quote = price?.ethUsdQuote;
            const liquidity = token?.liquidityEvidence;
            const provenance = liquidity?.provenance;
            if (
              !exactAddress(tokenAddress) ||
              tokenAddress === goldenTokenAddress ||
              valuation?.status !== "available" ||
              valuation.metric !== "fdv" ||
              valuation.supplyBasis !== "total" ||
              valuation.currency !== "usd" ||
              valuation.source !== "stateview-chainlink" ||
              valuation.freshness !== "current" ||
              !positiveInteger(valuation.valueWad) ||
              token.fdvUsdWad !== valuation.valueWad ||
              !positiveInteger(valuation.asOfBlock) ||
              !exactBytes32(valuation.asOfBlockHash) ||
              !currentMarketEvidenceTime(valuation.asOfTime) ||
              valuation.lagBlocks !== "0" ||
              price?.schemaVersion !==
                "programmable.stateview-chainlink-price-evidence.v1" ||
              price?.source !== "uniswap-v4-stateview-chainlink-v1" ||
              price.chainId !== "1" ||
              !sameAddress(price.tokenAddress, tokenAddress) ||
              !sameAddress(price.quoteAddress, nativeCurrency) ||
              !sameBytes32(price.poolId, market?.primaryPoolId) ||
              price.stateViewAddress?.toLowerCase() !== mainnetStateView ||
              price.stateViewRuntimeCodeHash !==
                mainnetStateViewRuntimeCodeHash ||
              price.blockNumber !== valuation.asOfBlock ||
              !sameBytes32(price.blockHash, valuation.asOfBlockHash) ||
              !exactUnixTimestamp(price.blockTimestamp) ||
              price.blockTime !== valuation.asOfTime ||
              price.blockTime !==
                new Date(
                  Number(BigInt(price.blockTimestamp)) * 1_000,
                ).toISOString() ||
              !positiveInteger(price.sqrtPriceX96) ||
              !positiveInteger(price.activeLiquidity) ||
              !positiveInteger(price.activeVirtualToken0Wei) ||
              !positiveInteger(price.activeVirtualLiquidityUsdWad) ||
              price.activeVirtualLiquidityValueBasis !==
                "stateview-active-liquidity-virtual-depth-usd" ||
              !positiveInteger(price.tokenPriceEthWei) ||
              !positiveInteger(price.tokenPriceUsdWad) ||
              price.totalSupplyRaw !== token.totalSupplyRaw ||
              price.tokenDecimals !== token.tokenDecimals ||
              price.fdvUsdWad !== valuation.valueWad ||
              quote?.feedAddress?.toLowerCase() !== mainnetEthUsdFeed ||
              !positiveInteger(quote.roundId) ||
              !positiveInteger(quote.answeredInRound) ||
              BigInt(quote.answeredInRound) < BigInt(quote.roundId) ||
              !positiveInteger(quote.answer) ||
              quote.decimals !== 8 ||
              !exactUnixTimestamp(quote.updatedAt) ||
              quote.updatedAtTime !==
                new Date(Number(BigInt(quote.updatedAt)) * 1_000).toISOString() ||
              !positiveInteger(token.totalSupplyRaw) ||
              !exactCanonicalClassicNativeToken(
                token,
                tokenAddress,
                market?.primaryPoolId,
              ) ||
              !Number.isSafeInteger(token.tokenDecimals) ||
              token.tokenDecimals < 0 ||
              token.tokenDecimals > 255 ||
              market?.schemaVersion !== "programmable.market-data.v1" ||
              market.source !== "bitquery" ||
              market.status !== "current" ||
              !currentMarketTime(market.generatedAt) ||
              !exactBytes32(market.primaryPoolId) ||
              !sameBytes32(token.poolId, market.primaryPoolId) ||
              primary?.identity?.chainId !== "1" ||
              !sameAddress(primary.identity.tokenAddress, tokenAddress) ||
              !sameBytes32(primary.identity.poolId, market.primaryPoolId) ||
              primary.identity.protocol !== "uniswap_v4" ||
              primary.source !== "bitquery" ||
              primary.status !== "current" ||
              hasUnevidencedBitqueryFdv(market) ||
              liquidity?.source !== "official-uniswap-v4-subgraph" ||
              liquidity.identity?.chainId !== "1" ||
              liquidity.identity.protocol !== "uniswap_v4" ||
              !sameBytes32(liquidity.identity.poolId, market.primaryPoolId) ||
              !sameAddress(liquidity.identity.tokenAddress, tokenAddress) ||
              !sameAddress(
                liquidity.identity.quoteAddress,
                price.quoteAddress,
              ) ||
              liquidity.valueBasis !== "official-subgraph-pool-tvl-usd" ||
              !sameAddress(
                liquidity.reportedPoolBalances?.token0?.address,
                price.quoteAddress,
              ) ||
              !sameAddress(
                liquidity.reportedPoolBalances?.token1?.address,
                tokenAddress,
              ) ||
              !Number.isSafeInteger(
                liquidity.reportedPoolBalances.token0.decimals,
              ) ||
              liquidity.reportedPoolBalances.token0.decimals !== 18 ||
              !Number.isSafeInteger(
                liquidity.reportedPoolBalances.token1.decimals,
              ) ||
              liquidity.reportedPoolBalances.token1.decimals !==
                token.tokenDecimals ||
              !unsignedDecimal(
                liquidity.reportedPoolBalances.token0.amountDecimal,
              ) ||
              !unsignedDecimal(
                liquidity.reportedPoolBalances.token1.amountDecimal,
              ) ||
              (!positiveDecimal(
                  liquidity.reportedPoolBalances.token0.amountDecimal,
                ) &&
                !positiveDecimal(
                  liquidity.reportedPoolBalances.token1.amountDecimal,
                )) ||
              !positiveInteger(liquidity.tvlUsdWad) ||
              BigInt(liquidity.tvlUsdWad) <
                minimumPublicFdvLiquidityUsdWad ||
              liquidity.freshness !== "current" ||
              provenance?.subgraphId !== officialV4SubgraphId ||
              provenance?.deployment !== officialV4SubgraphDeployment ||
              !positiveInteger(provenance.indexedBlockNumber) ||
              !exactBytes32(provenance.indexedBlockHash) ||
              !exactUnixTimestamp(provenance.indexedBlockTimestamp) ||
              !currentMarketEvidenceTime(provenance.indexedBlockTime) ||
              !positiveInteger(provenance.referenceHeadBlockNumber) ||
              !exactBytes32(provenance.referenceHeadBlockHash) ||
              !unsignedInteger(provenance.lagBlocks)
            ) return false;

            const valuationTimeSeconds = BigInt(
              Math.floor(Date.parse(valuation.asOfTime) / 1_000),
            );
            const indexedBlock = BigInt(provenance.indexedBlockNumber);
            const referenceBlock = BigInt(provenance.referenceHeadBlockNumber);
            const indexedTimestamp = BigInt(provenance.indexedBlockTimestamp);
            const feedUpdatedAt = BigInt(quote.updatedAt);
            const lagBlocks = BigInt(provenance.lagBlocks);
            const totalSupplyRaw = BigInt(token.totalSupplyRaw);
            const sqrtPriceX96 = BigInt(price.sqrtPriceX96);
            const activeLiquidity = BigInt(price.activeLiquidity);
            const marketCapNativeWad =
              (totalSupplyRaw * (1n << 192n) * 10n ** 18n) /
              (sqrtPriceX96 * sqrtPriceX96 * 10n ** 18n);
            const expectedFdvUsdWad =
              (marketCapNativeWad * BigInt(quote.answer)) /
              10n ** BigInt(quote.decimals);
            const expectedTokenPriceEthWei =
              ((1n << 192n) * 10n ** BigInt(token.tokenDecimals) *
                10n ** 18n) /
              (sqrtPriceX96 * sqrtPriceX96 * 10n ** 18n);
            const expectedTokenPriceUsdWad =
              (expectedTokenPriceEthWei * BigInt(quote.answer)) /
              10n ** BigInt(quote.decimals);
            const activeVirtualToken0Wei =
              (activeLiquidity * (1n << 96n)) / sqrtPriceX96;
            const expectedActiveVirtualLiquidityUsdWad =
              (2n * activeVirtualToken0Wei * BigInt(quote.answer)) /
              10n ** BigInt(quote.decimals);
            return indexedBlock <= referenceBlock &&
              valuation.asOfBlock === provenance.referenceHeadBlockNumber &&
              sameBytes32(
                valuation.asOfBlockHash,
                provenance.referenceHeadBlockHash,
              ) &&
              lagBlocks === referenceBlock - indexedBlock &&
              lagBlocks <= 64n &&
              (lagBlocks !== 0n ||
                sameBytes32(
                  provenance.indexedBlockHash,
                  provenance.referenceHeadBlockHash,
                )) &&
              provenance.indexedBlockTime ===
                new Date(Number(indexedTimestamp) * 1_000).toISOString() &&
              indexedTimestamp <= valuationTimeSeconds &&
              feedUpdatedAt <= valuationTimeSeconds &&
              valuationTimeSeconds - feedUpdatedAt <= 7_200n &&
              expectedFdvUsdWad > 0n &&
              expectedFdvUsdWad.toString() === valuation.valueWad &&
              expectedTokenPriceEthWei.toString() ===
                price.tokenPriceEthWei &&
              expectedTokenPriceUsdWad.toString() ===
                price.tokenPriceUsdWad &&
              activeVirtualToken0Wei.toString() ===
                price.activeVirtualToken0Wei &&
              expectedActiveVirtualLiquidityUsdWad >=
                minimumPublicFdvLiquidityUsdWad &&
              expectedActiveVirtualLiquidityUsdWad.toString() ===
                price.activeVirtualLiquidityUsdWad;
          };

          const explore = await requestJson(
            `/api/explore?limit=${marketCapPageSize}&page=1&sort=market-cap`,
            currentPublicMarketContract,
          );
          const marketCapTotal = Number(explore.total);
          const marketCapTotalPages = Number(explore.totalPages);
          if (
