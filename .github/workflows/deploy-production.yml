            goldenChart.asOfTime !== goldenChart.points.at(-1)?.observedAt ||
            goldenChart.truncated !== false ||
            goldenChart.__marketHeaders?.marketAsOf !== goldenChart.asOfTime ||
            goldenChart.__marketHeaders?.dataQuality !== goldenChart.status ||
            goldenChart.__marketHeaders?.priceSource !== "bitquery" ||
            !validMarketTime(goldenChart.asOfTime)
          ) {
            throw new Error("staged PCAN price history is not Bitquery-bound");
          }
          let previousChartTime = null;
          let previousChartBucketEnd = null;
          let previousChartBlock = null;
          let goldenObservedTrades = 0;
          for (const point of goldenChart.points) {
            const time = Date.parse(point?.time ?? "");
            const bucketStart = Date.parse(point?.bucketStart ?? "");
            const bucketEnd = Date.parse(point?.bucketEnd ?? "");
            const observedAt = Date.parse(point?.observedAt ?? "");
            const block = positiveInteger(point?.blockNumber)
              ? BigInt(point.blockNumber)
              : null;
            if (
              !Number.isFinite(time) ||
              point?.valueSemantics !== "period-median" ||
              !Number.isFinite(bucketStart) ||
              !Number.isFinite(bucketEnd) ||
              !Number.isFinite(observedAt) ||
              time !== bucketEnd ||
              bucketStart >= bucketEnd ||
              observedAt < bucketStart ||
              observedAt > bucketEnd ||
              block === null ||
              !positiveDecimal(point?.priceQuote) ||
              typeof point?.quoteSymbol !== "string" ||
              point.quoteSymbol.trim().length === 0 ||
              point?.priceUsd !== undefined ||
              point?.ohlcUsd !== undefined ||
              point?.ohlcQuote !== undefined ||
              !Number.isSafeInteger(point?.tradeCount) ||
              point.tradeCount < 1 ||
              (previousChartTime !== null && time <= previousChartTime) ||
              (previousChartBucketEnd !== null &&
                bucketStart < previousChartBucketEnd) ||
              (previousChartBlock !== null && block <= previousChartBlock)
            ) {
              throw new Error(
                "staged PCAN chart is not a strictly ordered positive history",
              );
            }
            goldenObservedTrades += point.tradeCount;
            if (!Number.isSafeInteger(goldenObservedTrades)) {
              throw new Error("staged PCAN chart trade count overflowed");
            }
            previousChartTime = time;
            previousChartBucketEnd = bucketEnd;
            previousChartBlock = block;
          }
          if (goldenObservedTrades !== goldenChart.swapCount) {
            throw new Error("staged PCAN chart trade count is inconsistent");
          }
          const historicalGoldenRelease =
            verifyBitqueryHistoricalGoldenReleaseV2({
              detailToken: goldenDetail.token,
              chart: goldenChart,
              parity: goldenParity,
            });
          const historicalPaidPathVerified =
            historicalGoldenRelease.schemaVersion ===
              "programmable.bitquery-historical-release.v2" &&
            historicalGoldenRelease.tokenAddress === goldenTokenAddress &&
            historicalGoldenRelease.poolId === goldenPoolId &&
            historicalGoldenRelease.blockNumber ===
              goldenPool.latestTrade.blockNumber &&
            historicalGoldenRelease.bitqueryFdvUsdWad ===
              goldenValuation.valueWad &&
            historicalGoldenRelease.confirmations >= 12 &&
            goldenChart.points.length >= 1 &&
            goldenChart.readStatus === "live" &&
            currentMarketTime(goldenChart.generatedAt) &&
            goldenChart.__marketHeaders?.dataQuality === goldenChart.status &&
            goldenChart.__marketHeaders?.marketSource === "bitquery" &&
            goldenChart.__marketHeaders?.priceSource === "bitquery";
          process.stdout.write(
            `${JSON.stringify({
              status: "verified-combined-staged-market-apis",
              tokenAddress: releaseToken.tokenAddress,
              goldenTokenAddress,
              goldenPoolId,
              goldenParity,
              historicalGoldenRelease,
              historicalPaidPathVerified,
              currentFdvCount,
              availableFdvCount,
              staleFdvCount,
              waitingForFirstTradeCount,
              incrementalLaunchAddress,
              launchCursorBlockNumber:
                incrementalDetail.launchDiscoverySnapshot.blockNumber,
            })}\n`,
          );
          NODE

      - name: Record registry identity and combined market path
        if: needs.release-gate.outputs.verified_read_model == 'true' && steps.read-model-policy.outputs.mode == 'direct-rpc'
        run: |
          {
            echo "## Read-model release policy"
            echo
            echo "Router and Registry remain the launch-identity authority."
            echo "Current public FDV uses exact-block StateView and Chainlink evidence, liquidity uses the official Uniswap v4 subgraph, and Bitquery remains the trade, volume and chart source; token identities do not disappear when market data is unavailable."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture staged read-model evidence
        id: read-model-capture
        if: needs.release-gate.outputs.verified_read_model == 'true' && steps.read-model-policy.outputs.mode == 'indexed-or-shadow'
        env:
          PROGRAMMABLE_PERFORMANCE_PROBE_TOKEN: ${{ secrets.PROGRAMMABLE_PERFORMANCE_PROBE_TOKEN }}
          PROGRAMMABLE_SHADOW_PROBE_TOKEN: ${{ secrets.PROGRAMMABLE_SHADOW_PROBE_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PROGRAMMABLE_READ_MODEL_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PROGRAMMABLE_READ_MODEL_VERCEL_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
        run: >-
          npm run perf:read-model:capture --
          --target-url "$PROGRAMMABLE_READ_MODEL_TARGET_URL"
          --deployment-id "$PROGRAMMABLE_READ_MODEL_VERCEL_DEPLOYMENT_ID"
          --output-directory "$RUNNER_TEMP/read-model-release-evidence"
          --kind production-canary
          --github-output "$GITHUB_OUTPUT"

      - name: Preserve staged read-model evidence
        if: needs.release-gate.outputs.verified_read_model == 'true' && steps.read-model-policy.outputs.mode == 'indexed-or-shadow'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: read-model-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.read-model-capture.outputs.evidence_directory }}
          if-no-files-found: error
          retention-days: 7

      - name: Gate indexed or shadow read path
        if: needs.release-gate.outputs.verified_read_model == 'true' && steps.read-model-policy.outputs.mode == 'indexed-or-shadow'
        env:
          PROGRAMMABLE_READ_MODEL_PERF_EVIDENCE_PATH: ${{ steps.read-model-capture.outputs.evidence_path }}
          PROGRAMMABLE_READ_MODEL_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PROGRAMMABLE_READ_MODEL_VERCEL_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          PROGRAMMABLE_WEBSITE_MAINNET_RPC_PRIMARY_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_WEBSITE_MAINNET_RPC_PRIMARY_ENDPOINT_COMMITMENT }}
          PROGRAMMABLE_WEBSITE_MAINNET_RPC_SECONDARY_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_WEBSITE_MAINNET_RPC_SECONDARY_ENDPOINT_COMMITMENT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npm run perf:read-model:gate

      - name: Reverify staged candidate binding
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
        run: |
          binding_output="$RUNNER_TEMP/final-staged-binding"
          test ! -e "$binding_output"
          npm run perf:read-model:staged-deployment -- \
            --target-url "$STAGED_TARGET_URL" \
            --github-output "$binding_output"
          grep -Fx "deployment_id=$EXPECTED_DEPLOYMENT_ID" "$binding_output"
          grep -Fx "target_url=$STAGED_TARGET_URL" "$binding_output"

      - name: Gate exact staged operational health
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          EXPECTED_GIT_HEAD: ${{ github.sha }}
        run: >-
          npm run perf:read-model:staged-health --
          --target-url "$STAGED_TARGET_URL"
          --deployment-id "$STAGED_DEPLOYMENT_ID"
          --git-head "$EXPECTED_GIT_HEAD"

      - name: Record staged candidate handoff
        env:
          DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.production-before.outputs.deployment_id }}
          PREVIOUS_GIT_HEAD: ${{ steps.production-before.outputs.git_head }}
          POLICY_MODE: ${{ steps.read-model-policy.outputs.mode }}
          READ_MODEL_REQUIRED: ${{ needs.release-gate.outputs.verified_read_model }}
        run: |
          {
            echo "## Staged production candidate"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Deployment ID: \`$DEPLOYMENT_ID\`"
            echo "- Target: $STAGED_TARGET_URL"
            echo "- Previous production deployment: \`$PREVIOUS_DEPLOYMENT_ID\`"
            echo "- Previous production commit: \`$PREVIOUS_GIT_HEAD\`"
            echo "- Read model: ${{ steps.read-model-policy.outputs.mode }}"
            echo "- Read-model verification required by this commit: \`$READ_MODEL_REQUIRED\`"
            echo
            echo "Stage-only: no production promotion was attempted."
            if [ "$READ_MODEL_REQUIRED" != "true" ]; then
              echo "This source-only UI/docs candidate leaves read-model bytes unchanged; the provider-specific release lane was not rerun."
              echo "Before any separately authorized promotion, reverify this exact staged deployment ID and commit binding."
            elif [ "$POLICY_MODE" = "indexed-or-shadow" ]; then
              echo "The manual operator must next capture and verify the DB-authored real-block SLA attestation, reverify this exact staged binding, promote this exact deployment ID, and run the post-promotion binding gate."
            elif [ "$POLICY_MODE" = "direct-rpc" ]; then
              echo "Before any separately authorized promotion, reverify this exact staged deployment ID and commit binding."
            else
              echo "Unrecognized staged release policy mode" >&2
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"
