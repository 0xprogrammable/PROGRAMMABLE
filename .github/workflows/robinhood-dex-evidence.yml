name: Robinhood DEX Owner-Authorized Remote Observation and Local Simulation

on:
  workflow_dispatch:
    inputs:
      owner_terms_authorized:
        description: "Enter I_AUTHORIZE_ROBINHOOD_SERVICES_ACCESS_FOR_THIS_RUN after explicit owner authorization"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: robinhood-dex-owner-authorized-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-authorized-testnet-observation:
    name: Owner-authorized official RPC observation and disposable local simulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Require exact run-scoped owner authorization before Services access
        shell: bash
        env:
          OWNER_TERMS_AUTHORIZED_INPUT: ${{ inputs.owner_terms_authorized }}
        run: |
          set -euo pipefail
          expected="I_AUTHORIZE_ROBINHOOD_SERVICES_ACCESS_FOR_THIS_RUN"
          if [[ "$OWNER_TERMS_AUTHORIZED_INPUT" != "$expected" ]]; then
            echo "Exact owner authorization is required before this workflow may access Robinhood Services." >&2
            exit 1
          fi
          echo "PROGRAMMABLE_ROBINHOOD_SERVICES_OWNER_AUTHORIZED=$expected" >> "$GITHUB_ENV"

      - name: Check out exact revision without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          submodules: false

      - name: Set up exact Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0

      - name: Set up exact Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1

      - name: Bootstrap exact pinned Solidity test dependency
        shell: bash
        run: bash scripts/bootstrap-dex-evm-deps.sh

      - name: Run owner-authorized official RPC observation and disposable local-only foundations simulation
        shell: bash
        run: bash scripts/verify-robinhood-dex-readonly.sh
