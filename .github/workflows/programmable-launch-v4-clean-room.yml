name: Programmable Launch V4 clean-room no-broadcast evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: programmable-launch-v4-clean-room
  cancel-in-progress: false

jobs:
  clean-room:
    name: Stop at exact Robinhood wallet action
    if: >-
      github.repository_id == 1314365508 &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/production' &&
      github.ref_protected == true &&
      github.actor == 'hazarxyz' &&
      github.actor_id == '258789013' &&
      github.triggering_actor == 'hazarxyz' &&
      github.run_attempt == 1 &&
      github.event.sender.login == 'hazarxyz' &&
      github.event.sender.id == 258789013
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      actions: read
      attestations: read
      contents: read

    steps:
      - name: Check out exact protected production source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Bind detached checkout to protected production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/programmable-v4-clean-room-git-askpass"
          trap 'rm -f -- "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --no-tags --prune origin \
            +refs/heads/production:refs/remotes/origin/production
          rm -f -- "$askpass"
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/production^{commit})" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/production"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/programmable-launch-v4-clean-room.yml@$GITHUB_REF"
          test -z "$(git symbolic-ref -q HEAD || true)"
          test "$(git remote get-url origin)" = "https://github.com/$GITHUB_REPOSITORY"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up exact Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0

      - name: Set up exact npm
        run: |
          set -euo pipefail
          npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v24.14.0"
          test "$(npm --version)" = "11.16.0"

      - name: Fetch public project image without production API credentials
        env:
          PROJECT_IMAGE_URI: ${{ vars.PROGRAMMABLE_V4_CLEAN_ROOM_PROJECT_IMAGE_URI }}
        run: |
          set -euo pipefail
          test -n "$PROJECT_IMAGE_URI"
          [[ "$PROJECT_IMAGE_URI" =~ ^https:// ]]
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --max-filesize 5242880 \
            "$PROJECT_IMAGE_URI" \
            --output "$RUNNER_TEMP/programmable-v4-clean-room-project-image"
          test -s "$RUNNER_TEMP/programmable-v4-clean-room-project-image"

      - name: Fresh-download, attest, install, pack, and validate locally
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_IMAGE_URI: ${{ vars.PROGRAMMABLE_V4_CLEAN_ROOM_PROJECT_IMAGE_URI }}
          PROJECT_WEBSITE_URL: ${{ vars.PROGRAMMABLE_V4_CLEAN_ROOM_WEBSITE_URL }}
          PROJECT_X_URL: ${{ vars.PROGRAMMABLE_V4_CLEAN_ROOM_X_URL }}
          PUBLIC_LAUNCH_WALLET: ${{ vars.PROGRAMMABLE_V4_CLEAN_ROOM_LAUNCH_WALLET }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$PUBLIC_LAUNCH_WALLET"
          test -n "$PROJECT_IMAGE_URI"
          test -n "$PROJECT_WEBSITE_URL"
          test -n "$PROJECT_X_URL"
          test -z "${PROGRAMMABLE_API_KEY:-}"
          node scripts/programmable-launch-v4-clean-room.mjs prepare \
            --workspace "$RUNNER_TEMP/programmable-launch-v4-clean-room" \
            --image "$RUNNER_TEMP/programmable-v4-clean-room-project-image" \
            --launch-wallet "$PUBLIC_LAUNCH_WALLET" \
            --image-uri "$PROJECT_IMAGE_URI" \
            --website-url "$PROJECT_WEBSITE_URL" \
            --x-url "$PROJECT_X_URL"

      - name: Remote validate, submit, replay, and stop before wallet signing
        env:
          PROGRAMMABLE_API_KEY: ${{ secrets.PROGRAMMABLE_V4_CLEAN_ROOM_PRODUCTION_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$PROGRAMMABLE_API_KEY"
          node scripts/programmable-launch-v4-clean-room.mjs run \
            --workspace "$RUNNER_TEMP/programmable-launch-v4-clean-room" \
            --output "$RUNNER_TEMP/programmable-launch-v4-clean-room-evidence.json"

      - name: Reverify canonical redacted no-broadcast evidence
        run: >-
          node scripts/programmable-launch-v4-clean-room.mjs verify-evidence
          --input "$RUNNER_TEMP/programmable-launch-v4-clean-room-evidence.json"

      - name: Upload only canonical redacted evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: programmable-launch-v4-clean-room-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/programmable-launch-v4-clean-room-evidence.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
          compression-level: 0
          overwrite: false

      - name: Remove private transient request state
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/programmable-launch-v4-clean-room"
          rm -f -- "$RUNNER_TEMP/programmable-v4-clean-room-project-image"
