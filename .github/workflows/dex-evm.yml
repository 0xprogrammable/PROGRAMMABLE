name: DEX EVM

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dex-evm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Foundry, SDK, Slither, and artifact gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FOUNDRY_PROFILE: ci
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
      GIT_TERMINAL_PROMPT: "0"
      PROGRAMMABLE_DEX_ALLOW_DIRTY: "0"
      PROGRAMMABLE_DEX_REQUIRE_HEAD_REVISION_EVIDENCE: "1"
      PROGRAMMABLE_DEX_REQUIRE_EXACT_TOOLCHAIN: "1"

    steps:
      - name: Check out exact repository revision without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
          submodules: false

      - name: Set up exact Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: packages/dex-evm/sdk/package-lock.json

      - name: Set up Python for exact Slither
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up exact Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1

      - name: Install exact Slither
        shell: bash
        run: |
          set -euo pipefail
          pipx install slither-analyzer==0.11.5
          test "$(slither --version 2>&1 | tr -d '[:space:]')" = "0.11.5"

      - name: Bootstrap exact pinned Solidity test dependency
        shell: bash
        run: bash scripts/bootstrap-dex-evm-deps.sh

      - name: Verify DEX EVM package without RPC, signing, or broadcast
        shell: bash
        run: bash scripts/verify-dex-evm.sh

  echidna:
    name: Stateful property campaign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: ci
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Check out exact repository revision without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
          submodules: false

      - name: Set up exact Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0

      - name: Set up Python for exact Slither
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up exact Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1

      - name: Install exact Slither
        shell: bash
        run: |
          set -euo pipefail
          pipx install slither-analyzer==0.11.5
          test "$(slither --version 2>&1 | tr -d '[:space:]')" = "0.11.5"

      - name: Bootstrap exact pinned Solidity test dependency
        shell: bash
        run: bash scripts/bootstrap-dex-evm-deps.sh

      - name: Install exact Echidna release artifact
        id: echidna
        shell: bash
        env:
          ECHIDNA_ARCHIVE_SHA256: 436d26cb5af34c6c525812b857ac53f218c7f6ad07d69495ef88bc4cdc85c764
          ECHIDNA_ARCHIVE_URL: https://github.com/crytic/echidna/releases/download/v2.3.3/echidna-2.3.3-x86_64-linux.tar.gz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/echidna-2.3.3-x86_64-linux.tar.gz"
          install_root="$RUNNER_TEMP/echidna-2.3.3"
          mkdir -p "$install_root"
          curl --fail --silent --show-error --location --output "$archive" "$ECHIDNA_ARCHIVE_URL"
          echo "$ECHIDNA_ARCHIVE_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_root"
          test "$("$install_root/echidna" --version)" = "Echidna 2.3.3"
          echo "binary=$install_root/echidna" >> "$GITHUB_OUTPUT"

      - name: Run exact Echidna foundations campaign
        shell: bash
        env:
          ECHIDNA_BIN: ${{ steps.echidna.outputs.binary }}
          PROGRAMMABLE_DEX_ECHIDNA_TEST_LIMIT: "50000"
          PROGRAMMABLE_DEX_ECHIDNA_SEQUENCE_LENGTH: "100"
          PROGRAMMABLE_DEX_ECHIDNA_TIMEOUT_SECONDS: "300"
          PROGRAMMABLE_DEX_ECHIDNA_WORKERS: "1"
        run: |
          set -euo pipefail
          bash scripts/verify-dex-evm-echidna.sh
